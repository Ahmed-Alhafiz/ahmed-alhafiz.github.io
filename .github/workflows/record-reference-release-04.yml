name: Record verified reference release 04

on:
  push:
    branches: [main]
    paths:
      - .github/record-reference-release-04.manifest

permissions:
  contents: write

concurrency:
  group: record-reference-release-04
  cancel-in-progress: false

jobs:
  verify-record-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify repository and live GitHub Pages routes
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'release=reference-release-04' .github/record-reference-release-04.manifest
          python -m py_compile tools/site_audit.py tools/editorial_quality_gate.py
          python tools/site_audit.py
          python tools/editorial_quality_gate.py

          base='https://ahmed-alhafiz.github.io'
          check_html() {
            local route="$1"
            local needle="$2"
            local out="/tmp/$(echo "$route" | tr '/ ' '__').html"
            curl --fail --location --retry 8 --retry-all-errors --connect-timeout 20 --max-time 120 \
              "$base$route?release04=$(date +%s%N)" -o "$out"
            grep -Fq "$needle" "$out"
          }
          check_html '/articles/' 'الدراسات والمقالات'
          check_html '/articles/six-days-creation-cosmic-time/' 'أيام الخلق الستة والزمن الكوني'
          check_html '/articles/functional-seizures-vs-epilepsy/' 'النوبات الوظيفية والصرع'
          check_html '/books/sirou-fi-alard/' '/articles/six-days-creation-cosmic-time/'
          check_html '/books/umm-abbas/' '/articles/functional-seizures-vs-epilepsy/'

          curl --fail --location --retry 8 --retry-all-errors --connect-timeout 20 --max-time 120 \
            "$base/sitemap.xml?release04=$(date +%s%N)" -o /tmp/sitemap.xml
          grep -Fq '/articles/six-days-creation-cosmic-time/' /tmp/sitemap.xml
          grep -Fq '/articles/functional-seizures-vs-epilepsy/' /tmp/sitemap.xml

          curl --fail --location --retry 8 --retry-all-errors --connect-timeout 20 --max-time 120 \
            "$base/articles/feed.xml?release04=$(date +%s%N)" -o /tmp/feed.xml
          grep -Fq 'six-days-creation-cosmic-time' /tmp/feed.xml
          grep -Fq 'functional-seizures-vs-epilepsy' /tmp/feed.xml

      - name: Append correction and verified release record
        shell: bash
        env:
          RELEASE_SHA: 73c7d57dd421e4a632a8f9b77eadf563a9af2516
          PR_NUMBER: '7'
          PR_CI_RUN: '33563747279'
          MAIN_CI_RUN: '33563836430'
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          ledger_path = Path('.github/SEO_OPERATIONS_LEDGER.md')
          ledger = ledger_path.read_text(encoding='utf-8').rstrip()
          marker = '### 2026-09-01 — Accuracy correction and verified reference release 04'
          if marker not in ledger:
              block = f'''{marker}
          - Task: reference-content engine / deployment correction / persistent quality assurance
          - Books: «قل سيروا في الأرض فانظروا كيف بدأ الخلق» + «أم عباس لجلب الحبيب ورد المطلقة»
          - Accuracy correction: the earlier first-reference-release entry correctly described the two initially published studies and supporting infrastructure, but overstated that two additional studies, the editorial quality gate, complete artifact cleanup, and a final four-article verification were already live. Actual `main` inspection found those two pages absent and stale failed one-time release artifacts still present. This entry supersedes only those inaccurate completion and verification claims; it does not erase the work that was genuinely live.
          - Release: pull request #{os.environ['PR_NUMBER']} merged as `{os.environ['RELEASE_SHA']}`.
          - New public studies:
            1. `/articles/six-days-creation-cosmic-time/` — 2,598 visible words and 11 visible sources at CI verification;
            2. `/articles/functional-seizures-vs-epilepsy/` — 2,775 visible words and 10 visible sources at CI verification.
          - Updated discovery: article hub, Atom feed, sitemap, and reciprocal visible/machine-readable links from the two corresponding forthcoming-book pages.
          - Persistent controls: `tools/editorial_quality_gate.py` and the expanded `site-integrity.yml` now validate depth, direct answers, JSON-LD/XML, citation count and source diversity, hub/feed/sitemap coverage, reciprocal book relations, uncertainty language, and medical safeguards.
          - Cleanup: removed bridge tests, stale manifests, incomplete bundle parts, and all failed one-time apply/finalize workflows; only the persistent integrity workflow remains.
          - Verification:
            - pull-request integrity run `{os.environ['PR_CI_RUN']}`: success;
            - post-merge integrity run `{os.environ['MAIN_CI_RUN']}`: success;
            - repository audit: 25 HTML pages, 25 canonicals, 25 sitemap URLs, 0 errors, 0 warnings;
            - editorial gate: four reference articles passed; visible word/source counts were 2,079/8, 2,598/11, 2,379/6, and 2,775/10;
            - live GitHub Pages fetch: article hub, both new studies, both reciprocal book links, sitemap entries, and Atom entries passed.
          - Publication safety: both manuscripts remain represented as forthcoming / `قيد الإصدار`; no unconfirmed publisher, ISBN, fixed release date, review, sales claim, long excerpt, or plot-sensitive disclosure was added.
          - Status: `EXECUTED_VERIFIED`
          - Measurement: deployment does not prove ranking or AI citation gains. Compare finalized Search Console/referral evidence at 14, 28, and 56 days and expand only distinct, useful clusters.
          '''
              ledger_path.write_text(ledger + '\n\n' + block.strip() + '\n', encoding='utf-8')

          checkpoint_path = Path('.github/CONTENT_CURRENT_CHECKPOINT.md')
          checkpoint = checkpoint_path.read_text(encoding='utf-8')
          checkpoint = checkpoint.replace(
              '- Current state: `RELEASE_CANDIDATE_AWAITING_CI`.\n- The new pages must not be described as live until the pull-request checks pass, the branch is merged into `main`, GitHub Pages deploys, and the public URLs are fetched successfully.\n- Search ranking and AI citation improvement remain measurement questions, not deployment facts.',
              '- Current state: `EXECUTED_VERIFIED`.\n- Pull request #7 merged into `main` as `73c7d57dd421e4a632a8f9b77eadf563a9af2516`.\n- Pull-request and post-merge structural/editorial workflows passed.\n- Live GitHub Pages checks passed for the article hub, both new studies, reciprocal links on both book pages, sitemap entries, and Atom feed entries.\n- Search ranking and AI citation improvement remain measurement questions, not deployment facts.'
          )
          checkpoint = re.sub(
              r'## Immediate next actions\n.*\Z',
              '''## Verified release results

- Structural audit: 25 HTML pages, 25 canonicals, 25 sitemap URLs, 0 errors, 0 warnings.
- Editorial gate: four reference articles passed all depth, evidence, linking and safety checks.
- Verified visible word/source counts:
  - ratq/fatq: 2,079 words / 8 sources;
  - six days/cosmic time: 2,598 words / 11 sources;
  - sleep paralysis/jathoom: 2,379 words / 6 sources;
  - functional seizures/epilepsy: 2,775 words / 10 sources.
- Obsolete one-time release artifacts: removed.
- Persistent workflow: structural and editorial gates run on every pull request and push to `main`.

## Immediate next actions

1. Do not rewrite the newly released studies without a documented defect or evidence from search/referral data.
2. Monitor finalized Search Console and referral evidence at 14, 28, and 56 days from release commit `73c7d57dd421e4a632a8f9b77eadf563a9af2516`.
3. Continue with one distinct high-value article at a time. The next provisional Sirou topic is «تعليم الأسماء والذكاء الاصطناعي: من المفهوم إلى الآلة»; the next provisional Umm-Abbas topic is exploitation of frightened families by fraudulent spiritual healers.
4. Each new study requires fresh source research, manuscript disclosure review, reciprocal book linking, and the same structural/editorial quality gates.
5. «كتاب الكتب» and «جهيمان» remain deferred until explicit user instruction.
''',
              checkpoint,
              flags=re.S,
          )
          checkpoint_path.write_text(checkpoint.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Remove one-time recorder and commit verified state
        shell: bash
        run: |
          set -euo pipefail
          rm .github/record-reference-release-04.manifest
          rm .github/workflows/record-reference-release-04.yml
          git diff --check
          git config user.name 'Ahmed-Alhafiz'
          git config user.email 'hhafz9924@gmail.com'
          git add -A
          git commit -m 'Record verified reference release 04'
          git push origin HEAD:main
