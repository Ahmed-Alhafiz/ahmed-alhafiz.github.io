name: Finalize editorial release 05

on:
  push:
    branches: [main]
    paths:
      - .github/finalize-editorial-release-05.trigger

permissions:
  contents: write

concurrency:
  group: finalize-editorial-release-05
  cancel-in-progress: false

jobs:
  verify-record-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify merged editorial release
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'release=editorial-05' .github/finalize-editorial-release-05.trigger
          release_sha="$(git log --all --grep='Publish AI meaning and spiritual-healing safeguarding studies' -1 --format='%H')"
          test -n "$release_sha"
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"
          echo "$release_sha" > /tmp/release-sha.txt

      - name: Run complete repository and editorial verification
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/site_audit.py tools/editorial_quality_gate.py
          python tools/site_audit.py | tee /tmp/site-audit.txt
          python tools/editorial_quality_gate.py | tee /tmp/editorial-gate.txt
          python - <<'PY' | tee /tmp/data-parse.txt
          import json
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path

          class JsonLdParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.active = False
                  self.buf = []
                  self.blocks = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag.lower() == 'script' and attrs.get('type', '').lower() == 'application/ld+json':
                      self.active = True
                      self.buf = []
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.active:
                      self.blocks.append(''.join(self.buf))
                      self.active = False
              def handle_data(self, data):
                  if self.active:
                      self.buf.append(data)

          sitemap = ET.parse('sitemap.xml')
          feed = ET.parse('articles/feed.xml')
          pages = 0
          blocks = 0
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              parser = JsonLdParser()
              parser.feed(path.read_text(encoding='utf-8'))
              for block in parser.blocks:
                  if block.strip():
                      json.loads(block)
                      blocks += 1
              pages += 1
          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9', 'a': 'http://www.w3.org/2005/Atom'}
          sitemap_urls = len(sitemap.findall('s:url', ns))
          feed_entries = len(feed.findall('a:entry', ns))
          print(f'PASS: parsed {pages} HTML pages and {blocks} JSON-LD blocks')
          print(f'PASS: sitemap contains {sitemap_urls} URLs; Atom feed contains {feed_entries} entries')
          PY
          git diff --check

      - name: Verify the public GitHub Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          base='https://ahmed-alhafiz.github.io'
          : > /tmp/live-verification.txt
          check_page() {
            local path="$1"
            local needle="$2"
            local label="$3"
            local output="/tmp/live-$(echo "$path-$label" | tr '/ :?' '_____').txt"
            local ok=0
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --location --connect-timeout 20 --max-time 90 \
                "$base$path?release05=${GITHUB_RUN_ID}-${attempt}" -o "$output" \
                && grep -Fq "$needle" "$output"; then
                ok=1
                break
              fi
              sleep 15
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "FAIL: $label ($path)" | tee -a /tmp/live-verification.txt
              exit 1
            fi
            bytes="$(wc -c < "$output" | tr -d ' ')"
            echo "PASS: $label — $path — ${bytes} bytes" | tee -a /tmp/live-verification.txt
          }

          check_page '/articles/teaching-names-ai-understanding/' 'سُلّم الاسم' 'AI and teaching-names study'
          check_page '/articles/teaching-names-ai-understanding/' '<link rel="canonical" href="https://ahmed-alhafiz.github.io/articles/teaching-names-ai-understanding/">' 'AI canonical'
          check_page '/articles/spiritual-healing-exploitation-safeguarding/' 'اختبار الحدود الخمس' 'spiritual-healing safeguarding report'
          check_page '/articles/spiritual-healing-exploitation-safeguarding/' '<link rel="canonical" href="https://ahmed-alhafiz.github.io/articles/spiritual-healing-exploitation-safeguarding/">' 'safeguarding canonical'
          check_page '/articles/' '/articles/teaching-names-ai-understanding/' 'article hub AI link'
          check_page '/articles/' '/articles/spiritual-healing-exploitation-safeguarding/' 'article hub safeguarding link'
          check_page '/books/sirou-fi-alard/' '/articles/teaching-names-ai-understanding/' 'Sirou reciprocal link'
          check_page '/books/umm-abbas/' '/articles/spiritual-healing-exploitation-safeguarding/' 'Umm Abbas reciprocal link'
          check_page '/sitemap.xml' 'https://ahmed-alhafiz.github.io/articles/teaching-names-ai-understanding/' 'sitemap AI URL'
          check_page '/sitemap.xml' 'https://ahmed-alhafiz.github.io/articles/spiritual-healing-exploitation-safeguarding/' 'sitemap safeguarding URL'
          check_page '/articles/feed.xml' 'teaching-names-ai-understanding' 'Atom feed AI entry'
          check_page '/articles/feed.xml' 'spiritual-healing-exploitation-safeguarding' 'Atom feed safeguarding entry'
          check_page '/robots.txt' 'User-agent: OAI-SearchBot' 'OAI search crawler access'

      - name: Record verified release and advance project memory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import os

          release_sha = os.environ['RELEASE_SHA']
          workflow_run = os.environ['GITHUB_RUN_ID']
          now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          site_audit = Path('/tmp/site-audit.txt').read_text(encoding='utf-8').strip()
          editorial = Path('/tmp/editorial-gate.txt').read_text(encoding='utf-8').strip()
          data_parse = Path('/tmp/data-parse.txt').read_text(encoding='utf-8').strip()
          live = Path('/tmp/live-verification.txt').read_text(encoding='utf-8').strip()

          record = f'''# Editorial Release 05 — Live Verification

          **Status:** `EXECUTED_VERIFIED`  
          **Verified:** `{now}`  
          **Release commit:** `{release_sha}`  
          **Final verification workflow run:** `{workflow_run}`

          ## Published reference studies

          1. `/articles/teaching-names-ai-understanding/`
             - Linked to the forthcoming book «قل سيروا في الأرض فانظروا كيف بدأ الخلق».
             - Separates Qur'anic exegesis, language-model engineering, empirical competence, symbol grounding, consciousness and responsibility.
             - Introduces the analytical framework «سُلّم الاسم» without presenting it as an established external scientific taxonomy.
          2. `/articles/spiritual-healing-exploitation-safeguarding/`
             - Linked to the forthcoming novel «أم عباس لجلب الحبيب ورد المطلقة» without revealing plot-sensitive material.
             - Separates voluntary religious support from coercion, medical delay, financial exploitation and sexual-boundary violations.
             - Includes educational-only wording, emergency guidance, medication safeguards and local-law caveats.

          ## Structural audit

          ```text
          {site_audit}
          ```

          ## Editorial, evidence and safety gate

          ```text
          {editorial}
          ```

          ## Structured-data and XML parse

          ```text
          {data_parse}
          ```

          ## Public deployment verification

          ```text
          {live}
          ```

          ## Claims deliberately withheld

          - No claim that rankings improved before real Search Console data.
          - No claim that ChatGPT or another answer engine cited the pages before verifiable referral/citation evidence.
          - No publication, publisher, ISBN, review, sales or popularity claim for an unpublished work.
          - No diagnosis or individualized medical, legal or religious ruling.
          '''
          Path('.github/EDITORIAL_RELEASE_05_LIVE_VERIFICATION.md').write_text(record.replace('\n          ', '\n').strip() + '\n', encoding='utf-8')

          checkpoint_path = Path('.github/CONTENT_CURRENT_CHECKPOINT.md')
          checkpoint = checkpoint_path.read_text(encoding='utf-8')
          checkpoint = checkpoint.replace('**Updated:** 2026-09-01', '**Updated:** 2026-09-02')
          marker = '## Editorial release 05 — verified live deployment'
          block = f'''\n\n{marker}

          - Status: `EXECUTED_VERIFIED`.
          - Release commit: `{release_sha}`.
          - Added two independently sourced reference studies:
            - «تعليم الأسماء والذكاء الاصطناعي: هل تفهم الآلة الكلمات أم تتنبأ بها؟» linked reciprocally to «سيروا في الأرض».
            - «حين يتحول العلاج الروحي إلى استغلال: كيف تحمي الأسرة المريض من الدجل والاعتداء؟» linked reciprocally to «أم عباس».
          - Article hub, Atom feed, sitemap and both relevant book pages were updated and verified publicly.
          - Permanent quality gate now covers seven reference pages and includes article-specific medical, medication and safeguarding checks.
          - Full repository audit, JSON-LD/XML parse and public-page verification: PASS.
          - Evidence file: `.github/EDITORIAL_RELEASE_05_LIVE_VERIFICATION.md`.
          - Next: allow the new pages to be discovered and measured; expand only after quality review and query evidence, not to inflate page count.
          - Measurement policy remains 14, 28 and 56 days; do not claim ranking or AI-citation gains without data.
          '''.replace('\n          ', '\n')
          if marker not in checkpoint:
              checkpoint_path.write_text(checkpoint.rstrip() + block + '\n', encoding='utf-8')

          ledger_path = Path('.github/SEO_OPERATIONS_LEDGER.md')
          ledger = ledger_path.read_text(encoding='utf-8')
          ledger_marker = '### 2026-09-02 — Editorial reference release 05 verified live'
          ledger_block = f'''\n\n{ledger_marker}
          - Task: owned-surface authority / reference-content expansion / AI discoverability.
          - Books: «قل سيروا في الأرض فانظروا كيف بدأ الخلق» + «أم عباس لجلب الحبيب ورد المطلقة».
          - Action: published two long-form, independently sourced Arabic studies on AI meaning/understanding and safeguarding against exploitation in spiritual-healing contexts; added reciprocal book links; updated article hub, Atom feed and sitemap; extended permanent quality gates.
          - URLs:
            - https://ahmed-alhafiz.github.io/articles/teaching-names-ai-understanding/
            - https://ahmed-alhafiz.github.io/articles/spiritual-healing-exploitation-safeguarding/
          - Release commit: `{release_sha}`.
          - Verification: repository audit, editorial/evidence/safety gate, JSON-LD and XML parsing, and public GitHub Pages checks all passed. Detailed record: `.github/EDITORIAL_RELEASE_05_LIVE_VERIFICATION.md`.
          - Publication safety: no plot disclosure beyond already public themes; both works remain clearly forthcoming; no publisher/ISBN/review/sales claims.
          - Status: `EXECUTED_VERIFIED`.
          - Next: measure indexing, queries and referrals at 14/28/56 days; do not rewrite the pages without a documented factual defect or evidence-backed opportunity.
          '''.replace('\n          ', '\n')
          if ledger_marker not in ledger:
              ledger_path.write_text(ledger.rstrip() + ledger_block + '\n', encoding='utf-8')

          truth_path = Path('.github/SEO_SOURCE_OF_TRUTH.md')
          truth = truth_path.read_text(encoding='utf-8')
          truth = truth.replace('Last verified: 2026-09-01 (Europe/Vienna)', 'Last verified: 2026-09-02 (Europe/Vienna)')
          truth_marker = '## Verified reference-content baseline — 2026-09-02'
          truth_block = f'''\n\n{truth_marker}

          - The Arabic article hub is live at `/articles/` and the Atom feed at `/articles/feed.xml`.
          - Seven reference pages are covered by the permanent editorial quality gate: six long-form studies plus the psychological-horror guide.
          - The two newest verified studies are `/articles/teaching-names-ai-understanding/` and `/articles/spiritual-healing-exploitation-safeguarding/`.
          - Both newest studies have reciprocal links from the relevant forthcoming-book pages, are listed in the sitemap/feed, and passed live public deployment verification.
          - Verification record: `.github/EDITORIAL_RELEASE_05_LIVE_VERIFICATION.md`.
          - This baseline proves technical publication and quality-gate passage only; it does not prove improved ranking or AI citation.
          '''.replace('\n          ', '\n')
          if truth_marker not in truth:
              truth_path.write_text(truth.rstrip() + truth_block + '\n', encoding='utf-8')
          PY

          rm -f .github/finalize-editorial-release-05.trigger
          rm -f .github/workflows/finalize-editorial-release-05.yml
          git diff --check

      - name: Commit verified operational state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ahmed-Alhafiz'
          git config user.email 'hhafz9924@gmail.com'
          git add -A
          git commit -m 'Verify live editorial release 05'
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
