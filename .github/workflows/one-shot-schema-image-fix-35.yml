name: One-shot schema image fix 35

on:
  push:
    branches:
      - indexing-schema-image-fix-35

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply exact schema image fix
        run: python tools/one_shot_schema_image_fix_35.py
      - name: Run repository audit
        run: python tools/site_audit.py
      - name: Remove one-shot files
        run: |
          rm tools/one_shot_schema_image_fix_35.py
          rm .github/workflows/one-shot-schema-image-fix-35.yml
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles/ratq-fatq-big-bang/evidence/index.html en/articles/ratq-fatq-big-bang/evidence/index.html sitemap.xml tools/site_audit.py tools/one_shot_schema_image_fix_35.py .github/workflows/one-shot-schema-image-fix-35.yml
          git diff --cached --check
          git commit -m 'Fix Article image structured data on evidence pages'
          git push
