name: One-time international copy follow-up

on:
  push:
    branches:
      - international-copy-truth-sync-21

permissions:
  contents: write

jobs:
  followup:
    if: ${{ !contains(github.event.head_commit.message, '[international-copy-followup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: international-copy-truth-sync-21
          fetch-depth: 0
      - name: Apply exact follow-up corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path_str, old, new, expected=1):
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact('en/about/index.html', 'Ahmed Alhafiz — author and writer', 'Ahmed Alhafiz — official author profile')

          replace_exact(
              'en/index.html',
              '<div class="kicker">Further Arabic dossiers</div><h2>More than an English landing page</h2>',
              '<div class="kicker">Further research in Arabic</div><h2>Additional research currently available in Arabic</h2>',
          )
          replace_exact(
              'en/index.html',
              '<article class="track-card"><div><span class="track-no">LANGUAGE / AI</span><h3><a href="/articles/teaching-names-ai-understanding/" hreflang="ar">Do language models understand words?</a></h3><p>An Arabic dossier separating prediction, representation, grounding, intention, and responsibility.</p></div><a href="/articles/teaching-names-ai-understanding/" hreflang="ar">Open Arabic dossier →</a></article>',
              '<article class="track-card"><div><span class="track-no">COSMIC TIME</span><h3><a href="/articles/six-days-creation-cosmic-time/" hreflang="ar">Six days of creation and cosmic time</a></h3><p>A focused Arabic brief on Qur’anic language, exegetical range, and the distinction between theological time-language and physical cosmology.</p></div><a href="/articles/six-days-creation-cosmic-time/" hreflang="ar">Open Arabic brief →</a></article>',
          )
          replace_exact(
              'en/index.html',
              '<article class="track-card"><div><span class="track-no">STATUS</span><h3><a href="/en/research-status/">Review is disclosed, not implied</a></h3><p>The site distinguishes author review, automated validation, specialist review, and academic peer review.</p></div><a href="/en/research-status/">Review register →</a></article>',
              '<article class="track-card"><div><span class="track-no">SLEEP PARALYSIS</span><h3><a href="/articles/sleep-paralysis-jathoom/" hreflang="ar">Sleep paralysis and the sensed presence</a></h3><p>A medical-cultural Arabic brief on physiology, chest pressure, sensed presence, and cultural interpretation.</p></div><a href="/articles/sleep-paralysis-jathoom/" hreflang="ar">Open Arabic brief →</a></article>',
          )

          hygiene = Path('tools/public_presentation_hygiene.py')
          text = hygiene.read_text(encoding='utf-8')
          old = '''              Path("en/index.html"): (
                  "Official author and research platform",
                  "Enter the research desk",
                  "An author site built as a public research desk",
                  "New complete bilingual dossier",
                  "10 audited claims",
                  "JSON, BibTeX, RIS, and CFF",
              ),'''
          new = '''              Path("en/index.html"): (
                  "Official author and research platform",
                  "Enter the research desk",
                  "An author site built as a public research desk",
                  "New complete bilingual dossier",
                  "10 audited claims",
                  "JSON, BibTeX, RIS, and CFF",
                  "More than an English landing page",
                  "The site distinguishes author review, automated validation, specialist review, and academic peer review.",
              ),'''
          if text.count(old) != 1:
              raise SystemExit('tools/public_presentation_hygiene.py: EN homepage block drift')
          hygiene.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
      - name: Commit follow-up
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Finish international public copy cleanup [international-copy-followup]"
          git push origin HEAD:international-copy-truth-sync-21
