name: One-time Ahrefs diagnostic

on:
  push:
    branches:
      - ahrefs-remediation-24

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit reciprocal hreflang and Schema.org vocabulary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, urllib.request, xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          BASE='https://ahmed-alhafiz.github.io'
          ROOT=Path('.').resolve()

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.lang=''; self.canonical=''; self.alts={}; self.on=False; self.buf=[]; self.jsonld=[]
              def handle_starttag(self,tag,attrs):
                  a={k.lower():(v or '') for k,v in attrs}; tag=tag.lower()
                  if tag=='html': self.lang=a.get('lang','').lower()
                  elif tag=='link':
                      rel=set(a.get('rel','').lower().split())
                      if 'canonical' in rel: self.canonical=a.get('href','').strip()
                      if 'alternate' in rel and a.get('hreflang'): self.alts[a['hreflang'].lower()]=a.get('href','').strip()
                  elif tag=='script' and a.get('type','').lower()=='application/ld+json': self.on=True; self.buf=[]
              def handle_endtag(self,tag):
                  if tag.lower()=='script' and self.on:
                      self.jsonld.append(''.join(self.buf)); self.on=False; self.buf=[]
              def handle_data(self,data):
                  if self.on:self.buf.append(data)

          def path_for(url):
              u=urlparse(url); rel=u.path.lstrip('/')
              if not rel:return ROOT/'index.html'
              p=ROOT/rel
              if u.path.endswith('/'):p=p/'index.html'
              return p

          tree=ET.parse('sitemap.xml'); ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[(n.text or '').strip() for n in tree.findall('s:url/s:loc',ns) if n.text]
          pages={}
          for url in urls:
              p=path_for(url); q=P(); q.feed(p.read_text(encoding='utf-8')); pages[url]=q

          missing=[]; broken=[]; self_missing=[]; xdefault_missing=[]
          for src,q in pages.items():
              if q.alts and q.lang and q.alts.get(q.lang)!=src:self_missing.append((src,q.lang,q.alts.get(q.lang)))
              for code,target in q.alts.items():
                  if not target.startswith(BASE): continue
                  if target not in pages:
                      broken.append((src,code,target)); continue
                  tq=pages[target]
                  if code=='x-default':
                      if not any(v==src for k,v in tq.alts.items() if k=='x-default'):
                          xdefault_missing.append((src,target))
                      continue
                  if not q.lang:continue
                  if tq.alts.get(q.lang)!=src:
                      missing.append((src,q.lang,code,target,tq.alts.get(q.lang)))

          print(f'HREFLANG_AUDIT pages={len(pages)} reciprocal_missing={len(missing)} broken_targets={len(broken)} self_missing={len(self_missing)} xdefault_nonreciprocal={len(xdefault_missing)}')
          if missing:
              print('\nMISSING_RECIPROCAL')
              for src,slang,code,target,actual in missing:
                  print(f'{src} [{slang}] -> {code} {target} | target return {slang}={actual!r}')
          if broken:
              print('\nBROKEN_HREFLANG_TARGETS')
              for x in broken:print(x)
          if self_missing:
              print('\nSELF_HREFLANG_MISSING_OR_WRONG')
              for x in self_missing:print(x)

          # Schema.org vocabulary audit: invalid/deprecated types/properties and unexpected property domains.
          vocab_url='https://schema.org/version/latest/schemaorg-current-https.jsonld'
          with urllib.request.urlopen(vocab_url,timeout=30) as r:vocab=json.load(r)
          graph=vocab.get('@graph',[])
          def short(v):
              if isinstance(v,dict):v=v.get('@id','')
              if not isinstance(v,str):return ''
              if v.startswith('schema:'):return v.split(':',1)[1]
              if v.startswith('https://schema.org/') or v.startswith('http://schema.org/'):return v.rsplit('/',1)[-1]
              return v
          def ids(v):
              if isinstance(v,list):return {short(x) for x in v if short(x)}
              s=short(v); return {s} if s else set()
          classes=set(); props=set(); parent={}; domains={}; ranges={}; deprecated=set()
          for n in graph:
              sid=short(n.get('@id','')); ty=ids(n.get('@type'))
              if 'rdfs:Class' in ty: classes.add(sid)
              if 'rdf:Property' in ty: props.add(sid)
              if sid:
                  parent[sid]=ids(n.get('rdfs:subClassOf'))
                  domains[sid]=ids(n.get('schema:domainIncludes'))
                  ranges[sid]=ids(n.get('schema:rangeIncludes'))
                  if n.get('schema:supersededBy'):deprecated.add(sid)
          def ancestors(t):
              out={t}; stack=[t]
              while stack:
                  cur=stack.pop()
                  for p in parent.get(cur,set()):
                      if p not in out:out.add(p);stack.append(p)
              return out
          def type_ok(actual,allowed):
              return any(bool(ancestors(t)&allowed) for t in actual)
          issues=[]; page_issue_urls=set(); counts={}
          def add(url,kind,detail):
              issues.append((url,kind,detail));page_issue_urls.add(url);counts[kind]=counts.get(kind,0)+1
          def walk_obj(url,obj,path='$'):
              if isinstance(obj,list):
                  for i,x in enumerate(obj):walk_obj(url,x,f'{path}[{i}]')
                  return
              if not isinstance(obj,dict):return
              node_types=ids(obj.get('@type'))
              schema_keys=[k for k in obj if not k.startswith('@')]
              if schema_keys and not node_types and '@id' not in obj and '@graph' not in obj:
                  add(url,'missing_@type',f'{path} keys={schema_keys[:6]}')
              for t in node_types:
                  if t not in classes and t not in {'Text','URL','Date','DateTime','Integer','Number','Boolean'}: add(url,'invalid_type',f'{path} @{t}')
                  if t in deprecated:add(url,'deprecated_type',f'{path} @{t}')
              for k,v in obj.items():
                  if k.startswith('@'):
                      if k=='@graph':walk_obj(url,v,path+'.@graph')
                      continue
                  if k not in props:
                      add(url,'invalid_property',f'{path}.{k}')
                  else:
                      if k in deprecated:add(url,'deprecated_property',f'{path}.{k}')
                      allowed=domains.get(k,set())
                      if node_types and allowed and not type_ok(node_types,allowed):
                          add(url,'unexpected_property',f'{path}.{k} on {sorted(node_types)} expected domain {sorted(allowed)}')
                      vals=v if isinstance(v,list) else [v]
                      allowed_range=ranges.get(k,set())
                      for j,x in enumerate(vals):
                          if isinstance(x,dict) and x.get('@type') and allowed_range:
                              actual=ids(x.get('@type'))
                              if actual and not type_ok(actual,allowed_range):
                                  add(url,'unexpected_nested_type',f'{path}.{k}[{j}] {sorted(actual)} expected {sorted(allowed_range)}')
                  walk_obj(url,v,path+'.'+k)
          for url,q in pages.items():
              for raw in q.jsonld:
                  if not raw.strip():continue
                  try:data=json.loads(raw)
                  except Exception as e:add(url,'json_parse',str(e));continue
                  walk_obj(url,data)

          print(f'\nSCHEMA_AUDIT pages_with_issues={len(page_issue_urls)} total_issues={len(issues)} kinds={counts}')
          for url,kind,detail in issues:
              print(f'{kind} | {url} | {detail}')
          PY
