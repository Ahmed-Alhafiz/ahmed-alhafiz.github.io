name: Resolve site quality warnings

on:
  push:
    branches:
      - main
    paths:
      - ".github/quality-patch.marker"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed quality cleanup
        run: |
          python tools/patch_quality_warnings.py
          rm .github/quality-patch.marker
          python tools/site_audit.py
          git diff --check
      - name: Commit verified quality cleanup
        run: |
          git config user.name "Ahmed-Alhafiz"
          git config user.email "hhafz9924@gmail.com"
          git add -A
          git commit -m "Resolve metadata and image layout audit warnings"
          git push
