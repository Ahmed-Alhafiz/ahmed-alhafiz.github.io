name: Apply dossier 11 final source polish

on:
  push:
    branches:
      - umm-abbas-fear-certainty-authority-11
    paths:
      - .github/dossier11-final-source-polish.trigger

permissions:
  contents: write

concurrency:
  group: dossier11-final-source-polish
  cancel-in-progress: false

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply source corrections and restore unrelated files
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .github/dossier11-final-source-polish.trigger)" = 'run=1'
          python .github/dossier11_final_source_polish.py
          git checkout origin/main -- \
            assets/figures/ratq-evidence-map-ar.svg \
            assets/figures/ratq-evidence-map-en.svg \
            assets/figures/source-trust-pipeline-en.svg \
            assets/figures/water-power-justice-chain-ar.svg \
            assets/figures/water-power-justice-chain-en.svg \
            favicon.svg
          rm -f .github/dossier11_final_source_polish.py
          rm -f .github/dossier11-final-source-polish.trigger

      - name: Run complete permanent gates
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/apply-dossier11-visual-polish.yml'
          parked='/tmp/apply-dossier11-final-source-polish.yml'
          mv "$workflow" "$parked"
          trap 'mv "$parked" "$workflow" 2>/dev/null || true' EXIT

          python -m py_compile \
            tools/site_audit.py \
            tools/editorial_quality_gate.py \
            tools/discovery_integrity.py \
            tools/dossier11_integrity.py \
            tools/ux_integrity.py \
            tools/arabic_ui_integrity.py \
            tools/generate_diagnostic_uncertainty_social_cards.py \
            .github/visual-review/run_visual_review.py
          python tools/site_audit.py
          python tools/editorial_quality_gate.py
          python tools/discovery_integrity.py
          python tools/dossier11_integrity.py
          python tools/ux_integrity.py
          python tools/arabic_ui_integrity.py
          git diff --check

          grep -Fq 'https://nap.nationalacademies.org/catalog/21794/improving-diagnosis-in-health-care' articles/diagnostic-uncertainty-family-fear-coercive-authority/index.html
          grep -Fq '؛ لا تثبت أن المعالج التقليدي سبب التأخر' articles/diagnostic-uncertainty-family-fear-coercive-authority/evidence/claims.json
          grep -Fq 'الأهلية القانونية' articles/diagnostic-uncertainty-family-fear-coercive-authority/evidence/claims.json
          test ! -e .github/dossier11_final_source_polish.py
          test ! -e .github/dossier11-final-source-polish.trigger

          mv "$parked" "$workflow"
          trap - EXIT

      - name: Commit verified final correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ahmed-Alhafiz'
          git config user.email 'hhafz9924@gmail.com'
          git add -A
          git commit -m 'Finalize dossier source links language and diff scope'
          if ! git push origin HEAD:umm-abbas-fear-certainty-authority-11; then
            git pull --rebase origin umm-abbas-fear-certainty-authority-11
            git push origin HEAD:umm-abbas-fear-certainty-authority-11
          fi
