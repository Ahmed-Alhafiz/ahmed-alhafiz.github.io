name: Apply dossier 11 visual polish

on:
  push:
    branches:
      - umm-abbas-fear-certainty-authority-11
    paths:
      - .github/dossier11-visual-polish.trigger

permissions:
  contents: write

concurrency:
  group: dossier11-visual-polish
  cancel-in-progress: false

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install reproducible image dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core libraqm0
          python -m pip install --disable-pip-version-check --quiet "pillow>=11,<12"
          python - <<'PY'
          from PIL import features
          if not features.check('raqm'):
              raise SystemExit('Pillow/libraqm Arabic shaping support is required')
          print('libraqm shaping available')
          PY

      - name: Apply manual-review correction and regenerate share cards
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .github/dossier11-visual-polish.trigger)" = 'run=1'
          python .github/dossier11_visual_polish.py
          python tools/generate_diagnostic_uncertainty_social_cards.py
          rm -f .github/dossier11_visual_polish.py
          rm -f .github/dossier11-visual-polish.trigger

      - name: Run complete permanent gates
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/apply-dossier11-visual-polish.yml'
          parked='/tmp/apply-dossier11-visual-polish.yml'
          mv "$workflow" "$parked"
          trap 'mv "$parked" "$workflow" 2>/dev/null || true' EXIT

          python -m py_compile \
            tools/site_audit.py \
            tools/editorial_quality_gate.py \
            tools/discovery_integrity.py \
            tools/dossier11_integrity.py \
            tools/ux_integrity.py \
            tools/arabic_ui_integrity.py \
            tools/generate_diagnostic_uncertainty_social_cards.py \
            .github/visual-review/run_visual_review.py
          python tools/site_audit.py
          python tools/editorial_quality_gate.py
          python tools/discovery_integrity.py
          python tools/dossier11_integrity.py
          python tools/ux_integrity.py
          python tools/arabic_ui_integrity.py
          git diff --check

          grep -Fq 'id="cascade-figure"' articles/diagnostic-uncertainty-family-fear-coercive-authority/index.html
          grep -Fq 'id="parallel-figure"' articles/diagnostic-uncertainty-family-fear-coercive-authority/index.html
          grep -Fq 'fear-cascade-ar' .github/visual-review/run_visual_review.py
          grep -Fq 'fear-parallel-en' .github/visual-review/run_visual_review.py
          test ! -e .github/dossier11_visual_polish.py
          test ! -e .github/dossier11-visual-polish.trigger

          mv "$parked" "$workflow"
          trap - EXIT

      - name: Commit verified visual correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ahmed-Alhafiz'
          git config user.email 'hhafz9924@gmail.com'
          git add -A
          git commit -m 'Polish dossier share card and add framework visual captures'
          if ! git push origin HEAD:umm-abbas-fear-certainty-authority-11; then
            git pull --rebase origin umm-abbas-fear-certainty-authority-11
            git push origin HEAD:umm-abbas-fear-certainty-authority-11
          fi
