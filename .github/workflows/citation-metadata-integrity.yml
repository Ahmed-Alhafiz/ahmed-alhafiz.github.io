name: Citation metadata integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile citation gate
        run: python -m py_compile tools/citation_metadata_integrity.py

      - name: Validate CFF root semantics preferred citations and licensing
        run: python tools/citation_metadata_integrity.py

      - name: Check patch whitespace
        run: git diff --check
