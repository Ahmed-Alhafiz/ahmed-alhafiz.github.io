name: Apply reviewed content bundle

on:
  push:
    branches: [main]
    paths:
      - .github/content-bundle.manifest

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect a pending reviewed bundle
        id: bundle
        shell: bash
        run: |
          if [[ -f .github/content-bundle.manifest ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Bundle already consumed; nothing to apply."
          fi
      - name: Decode, verify and extract the reviewed bundle
        if: steps.bundle.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github -maxdepth 1 -name 'content-bundle.part-*' -type f | wc -l)" -eq 14
          cat .github/content-bundle.part-* > /tmp/content-bundle.tgz.b64
          base64 --decode /tmp/content-bundle.tgz.b64 > /tmp/content-bundle.tgz
          echo "00873465b7187943bd3980edad34639f126d279baa8dc8e5130032e8114a62f6  /tmp/content-bundle.tgz" | sha256sum --check --strict
          if tar -tzf /tmp/content-bundle.tgz | grep -E '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe path detected in bundle" >&2
            exit 1
          fi
          tar -xzf /tmp/content-bundle.tgz -C .
          rm .github/content-bundle.manifest .github/content-bundle.part-*
          python -m py_compile tools/site_audit.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('sitemap.xml')
          ET.parse('articles/feed.xml')
          print('XML checks passed')
          PY
          git diff --check
      - name: Commit the reviewed website release
        if: steps.bundle.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ahmed-Alhafiz"
          git config user.email "hhafz9924@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Publish reference articles and research infrastructure"
          git push
