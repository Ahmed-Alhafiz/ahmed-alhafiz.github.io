name: Finalize site UX rebuild 10

on:
  push:
    branches:
      - site-ux-rebuild-10
    paths:
      - .github/ux10-finalize.trigger

permissions:
  contents: write

concurrency:
  group: finalize-site-ux-rebuild-10
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final wording and obsolete-helper cleanup
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .github/ux10-finalize.trigger)" = 'run=1'
          python .github/ux10_finalize.py
          rm -f .github/ux10_finalize.py
          rm -f .github/ux10-finalize.trigger

      - name: Run complete structural editorial discovery and UX gates
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/site_audit.py \
            tools/editorial_quality_gate.py \
            tools/discovery_integrity.py \
            tools/ux_integrity.py \
            tools/arabic_ui_integrity.py \
            .github/visual-review/run_visual_review.py \
            .github/visual-review/run_visual_review_fixed.py \
            .github/visual-review/verify_book_covers.py
          python tools/site_audit.py
          python tools/editorial_quality_gate.py
          python tools/discovery_integrity.py
          python tools/ux_integrity.py
          python tools/arabic_ui_integrity.py
          git diff --check
          test ! -e .github/ux10_finalize.py
          test ! -e .github/ux10-finalize.trigger
          test ! -e .github/visual-review/layout-audit.template
          test ! -e .github/visual-review/capture.template
          test ! -e .github/visual-review/verify_layout.py
          test ! -e .github/visual-review/verify_artifact.py

      - name: Commit verified cleanup to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ahmed-Alhafiz'
          git config user.email 'hhafz9924@gmail.com'
          git add -A
          git commit -m 'Finalize visual regression and review transparency'
          if ! git push origin HEAD:site-ux-rebuild-10; then
            git pull --rebase origin site-ux-rebuild-10
            git push origin HEAD:site-ux-rebuild-10
          fi
