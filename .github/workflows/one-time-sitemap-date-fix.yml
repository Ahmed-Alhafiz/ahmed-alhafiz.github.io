name: One-time sitemap date fix

on:
  push:
    branches:
      - sitemap-lastmod-integrity-23

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message == 'Add one-time sitemap date fix' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sitemap-lastmod-integrity-23
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Synchronize canonical modification dates and harden site audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          ROOT=Path('.').resolve()
          TYPES={'WebPage','ProfilePage','CollectionPage','Article','ScholarlyArticle'}

          # This hub was edited in the current release; make its structured date truthful first.
          hub=Path('en/articles/index.html')
          text=hub.read_text(encoding='utf-8')
          old='"dateModified":"2026-09-03"'
          if text.count(old) != 1:
              raise SystemExit(f'en/articles/index.html: expected one stale dateModified, found {text.count(old)}')
          hub.write_text(text.replace(old, '"dateModified":"2026-09-05"'), encoding='utf-8')

          class LD(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True); self.on=False; self.buf=[]; self.blocks=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag.lower()=='script' and a.get('type','').lower()=='application/ld+json': self.on=True; self.buf=[]
              def handle_endtag(self, tag):
                  if tag.lower()=='script' and self.on: self.blocks.append(''.join(self.buf)); self.on=False
              def handle_data(self, data):
                  if self.on: self.buf.append(data)

          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.values(): yield from walk(child)
              elif isinstance(value, list):
                  for child in value: yield from walk(child)

          def page_path(url):
              p=urlparse(url); rel=p.path.lstrip('/')
              if not rel: return ROOT/'index.html'
              q=ROOT/rel
              if p.path.endswith('/'): q=q/'index.html'
              return q

          def modified_date(url):
              path=page_path(url)
              if not path.is_file(): raise SystemExit(f'{url}: local page missing')
              parser=LD(); parser.feed(path.read_text(encoding='utf-8'))
              dates=set()
              for raw in parser.blocks:
                  if not raw.strip(): continue
                  for node in walk(json.loads(raw)):
                      if not isinstance(node, dict): continue
                      typ=node.get('@type')
                      ok=bool(TYPES.intersection(typ)) if isinstance(typ,list) else typ in TYPES
                      if not ok or node.get('url') != url: continue
                      dm=node.get('dateModified')
                      if isinstance(dm,str) and dm: dates.add(dm[:10])
              if len(dates) != 1:
                  raise SystemExit(f'{url}: expected one canonical dateModified, found {sorted(dates)}')
              return next(iter(dates))

          sm=Path('sitemap.xml')
          source=sm.read_text(encoding='utf-8')
          tree=ET.parse(sm); ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          changed=[]
          for entry in tree.findall('s:url', ns):
              loc=(entry.findtext('s:loc', default='', namespaces=ns) or '').strip()
              last=(entry.findtext('s:lastmod', default='', namespaces=ns) or '').strip()
              expected=modified_date(loc)
              if last == expected: continue
              pattern=re.compile(r'(<loc>'+re.escape(loc)+r'</loc><lastmod>)([^<]+)(</lastmod>)')
              source,count=pattern.subn(lambda m: m.group(1)+expected+m.group(3), source)
              if count != 1:
                  raise SystemExit(f'sitemap.xml: expected one lastmod slot for {loc}, found {count}')
              changed.append((loc,last,expected))
          if len(changed) != 21:
              raise SystemExit(f'sitemap.xml: expected 21 corrected lastmod entries after hub date update, found {len(changed)}')
          sm.write_text(source, encoding='utf-8')
          print(f'Updated {len(changed)} sitemap lastmod entries from canonical JSON-LD dates.')
          for loc,old_date,new_date in changed:
              print(f'  {loc}: {old_date} -> {new_date}')

          audit=Path('tools/site_audit.py')
          code=audit.read_text(encoding='utf-8')
          parse_block="""def parse(path:Path)->Page:\n    q=Parser(path); q.feed(path.read_text(encoding='utf-8')); q.close(); q.p.title=re.sub(r'\\s+',' ',q.p.title).strip()\n    for raw in q.p.jsonld_raw: json.loads(raw)\n    return q.p\n"""
          helper="""def parse(path:Path)->Page:\n    q=Parser(path); q.feed(path.read_text(encoding='utf-8')); q.close(); q.p.title=re.sub(r'\\s+',' ',q.p.title).strip()\n    for raw in q.p.jsonld_raw: json.loads(raw)\n    return q.p\n\nDATE_MODIFIED_TYPES={'WebPage','ProfilePage','CollectionPage','Article','ScholarlyArticle'}\n\ndef iter_jsonld_nodes(value):\n    if isinstance(value,dict):\n        yield value\n        for child in value.values():yield from iter_jsonld_nodes(child)\n    elif isinstance(value,list):\n        for child in value:yield from iter_jsonld_nodes(child)\n\ndef canonical_modified_dates(page:Page,canonical:str)->set[str]:\n    dates=set()\n    for raw in page.jsonld_raw:\n        for node in iter_jsonld_nodes(json.loads(raw)):\n            if not isinstance(node,dict):continue\n            typ=node.get('@type')\n            typed=bool(DATE_MODIFIED_TYPES.intersection(typ)) if isinstance(typ,list) else typ in DATE_MODIFIED_TYPES\n            if not typed or node.get('url')!=canonical:continue\n            value=node.get('dateModified')\n            if isinstance(value,str) and value:dates.add(value[:10])\n    return dates\n"""
          if code.count(parse_block) != 1:
              raise SystemExit('tools/site_audit.py: parse block drift')
          code=code.replace(parse_block, helper)

          old_sitemap="""    # Sitemap coverage and validity.\n    sm=root/'sitemap.xml'; urls=set()\n    if sm.exists():\n        try:\n            tree=ET.parse(sm); ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}\n            urls={n.text.strip() for n in tree.findall('s:url/s:loc',ns) if n.text}\n        except Exception as e:errors.append(f'sitemap.xml: {e}')\n    elif not args.partial:errors.append('sitemap.xml missing')\n    for p,q in pages.items():\n        if q.canonical and q.canonical not in urls:errors.append(f'{p.relative_to(root)}: canonical absent from sitemap')\n    for u in urls:\n        p=site_path(root,u)\n        if p is not None and not p.exists():(warnings if args.partial else errors).append(f'sitemap.xml: no local page for {u}')\n"""
          new_sitemap="""    # Sitemap coverage, local validity, and lastmod truthfulness.\n    sm=root/'sitemap.xml'; urls=set(); sitemap_dates={}\n    if sm.exists():\n        try:\n            tree=ET.parse(sm); ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}\n            for entry in tree.findall('s:url',ns):\n                loc=(entry.findtext('s:loc',default='',namespaces=ns) or '').strip()\n                lastmod=(entry.findtext('s:lastmod',default='',namespaces=ns) or '').strip()\n                if not loc:errors.append('sitemap.xml: URL entry missing loc');continue\n                if loc in urls:errors.append(f'sitemap.xml: duplicate loc {loc}');continue\n                urls.add(loc); sitemap_dates[loc]=lastmod\n        except Exception as e:errors.append(f'sitemap.xml: {e}')\n    elif not args.partial:errors.append('sitemap.xml missing')\n    for p,q in pages.items():\n        if not q.canonical:continue\n        if q.canonical not in urls:errors.append(f'{p.relative_to(root)}: canonical absent from sitemap');continue\n        dates=canonical_modified_dates(q,q.canonical)\n        if len(dates)!=1:\n            errors.append(f'{p.relative_to(root)}: expected one canonical JSON-LD dateModified, found {sorted(dates)}')\n        else:\n            expected_date=next(iter(dates)); actual=sitemap_dates.get(q.canonical,'')\n            if actual!=expected_date:errors.append(f'{p.relative_to(root)}: sitemap lastmod {actual!r} != JSON-LD dateModified {expected_date!r}')\n    for u in urls:\n        p=site_path(root,u)\n        if p is not None and not p.exists():(warnings if args.partial else errors).append(f'sitemap.xml: no local page for {u}')\n"""
          if code.count(old_sitemap) != 1:
              raise SystemExit('tools/site_audit.py: sitemap block drift')
          code=code.replace(old_sitemap,new_sitemap)
          audit.write_text(code,encoding='utf-8')
          PY
          git diff --check

      - name: Verify synchronized dates before commit
        shell: bash
        run: |
          set -euo pipefail
          python tools/site_audit.py
          python -m py_compile tools/site_audit.py

      - name: Commit date integrity fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add en/articles/index.html sitemap.xml tools/site_audit.py
          git commit -m 'Synchronize sitemap lastmod with JSON-LD dates [sitemap-date-fix]'
          git push origin HEAD:sitemap-lastmod-integrity-23
