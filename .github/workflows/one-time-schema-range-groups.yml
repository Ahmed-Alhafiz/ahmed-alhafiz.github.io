name: One-time schema range groups
on:
  push:
    branches: [ahrefs-remediation-24]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Group strict Schema.org range mismatches by affected pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,urllib.request,xml.etree.ElementTree as ET
          from collections import defaultdict
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse
          class J(HTMLParser):
              def __init__(self):super().__init__();self.on=False;self.b=[];self.blocks=[]
              def handle_starttag(self,t,a):
                  if t=='script' and dict(a).get('type','').lower()=='application/ld+json':self.on=True;self.b=[]
              def handle_endtag(self,t):
                  if t=='script' and self.on:self.blocks.append(''.join(self.b));self.on=False
              def handle_data(self,d):
                  if self.on:self.b.append(d)
          with urllib.request.urlopen('https://schema.org/version/latest/schemaorg-current-https.jsonld',timeout=30) as r:v=json.load(r)
          def sh(x):
              if isinstance(x,dict):x=x.get('@id','')
              if not isinstance(x,str):return ''
              if x.startswith('schema:'):return x.split(':',1)[1]
              if x.startswith(('https://schema.org/','http://schema.org/')):return x.rsplit('/',1)[-1]
              return x
          def ids(x):
              if isinstance(x,list):return {sh(a) for a in x if sh(a)}
              s=sh(x);return {s} if s else set()
          props={}; parent={}
          for n in v.get('@graph',[]):
              sid=sh(n.get('@id',''))
              if sid:
                  props[sid]=ids(n.get('schema:rangeIncludes'));parent[sid]=ids(n.get('rdfs:subClassOf'))
          def anc(t):
              out={t};st=[t]
              while st:
                  z=st.pop()
                  for p in parent.get(z,set()):
                      if p not in out:out.add(p);st.append(p)
              return out
          def kinds(x):
              if isinstance(x,bool):return {'Boolean'}
              if isinstance(x,int):return {'Integer','Number','Float'}
              if isinstance(x,float):return {'Number','Float'}
              if isinstance(x,str):
                  a={'Text'}
                  if x.startswith('http'):a.add('URL')
                  if re.fullmatch(r'\d{4}-\d{2}-\d{2}',x):a.add('Date')
                  if re.match(r'^\d{4}-\d{2}-\d{2}T',x):a.add('DateTime')
                  return a
              return set()
          groups=defaultdict(set); examples={}
          def walk(o,url,path='$'):
              if isinstance(o,list):
                  for i,x in enumerate(o):walk(x,url,f'{path}[{i}]')
                  return
              if not isinstance(o,dict):return
              typ=o.get('@type');types=set(map(str,typ)) if isinstance(typ,list) else {str(typ)} if typ else set()
              for k,val in o.items():
                  if k.startswith('@'):
                      if k=='@graph':walk(val,url,path+'.@graph')
                      continue
                  allowed=props.get(k,set());vals=val if isinstance(val,list) else [val]
                  for x in vals:
                      if isinstance(x,(dict,list)):continue
                      actual=kinds(x)
                      if allowed and actual and not (actual&allowed):
                          sig=(tuple(sorted(types)),k,tuple(sorted(actual)),tuple(sorted(allowed)))
                          groups[sig].add(url);examples.setdefault(sig,(path+'.'+k,x))
                  walk(val,url,path+'.'+k)
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'};root=ET.parse('sitemap.xml')
          urls=[n.text.strip() for n in root.findall('s:url/s:loc',ns)]
          for u in urls:
              p=urlparse(u);r=p.path.lstrip('/');f=Path('index.html') if not r else Path(r)/'index.html' if p.path.endswith('/') else Path(r)
              q=J();q.feed(f.read_text(encoding='utf-8'))
              for raw in q.blocks:
                  if raw.strip():walk(json.loads(raw),u)
          print(f'STRICT_RANGE_GROUPS total_signatures={len(groups)}')
          for sig,pages in sorted(groups.items(),key=lambda z:(-len(z[1]),str(z[0]))):
              if len(pages) in {8,7,9}:
                  print(f'PAGES={len(pages)} SIG={sig} EXAMPLE={examples[sig]}')
                  for u in sorted(pages):print(' ',u)
          PY
