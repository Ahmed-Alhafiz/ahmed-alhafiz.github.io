name: One-time editorial cleanup

on:
  push:
    branches:
      - sitewide-editorial-credibility-20

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[editorial-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sitewide-editorial-credibility-20
          fetch-depth: 0
      - name: Apply exact editorial replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          old_footer = 'الموقع الرسمي للمؤلفات والملفات البحثية الموثقة'
          new_footer = 'الموقع الرسمي للكاتب أحمد الحافظ ومؤلفاته وملفاته البحثية'
          footer_hits = 0
          for path in root.rglob('*.html'):
              if '.git' in path.parts or '.github' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              count = text.count(old_footer)
              if count:
                  footer_hits += count
                  path.write_text(text.replace(old_footer, new_footer), encoding='utf-8')
          if footer_hits != 19:
              raise SystemExit(f'Expected 19 old footer occurrences, found {footer_hits}')

          def replace_exact(path_str, old, new, expected=1):
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact(
              'about/index.html',
              'المشروع الكتابي، المؤلفات قيد الإصدار، ومكتب الأبحاث المستقل.',
              'المشروع الكتابي، المؤلفات قيد الإصدار، والملفات البحثية المنشورة على الموقع.',
          )
          replace_exact(
              'about/index.html',
              'ينشر على موقعه الرسمي مؤلفاته قيد الإصدار وملفات بحثية مستقلة موثقة بالمصادر.',
              'ينشر على موقعه الرسمي مؤلفاته قيد الإصدار وملفات بحثية مستقلة تعتمد على مصادر خارجية وتوضح حالة مراجعتها وحدودها.',
          )
          replace_exact(
              'about/index.html',
              'يُذكر بوضوح ما راجعه المؤلف، وما خضع للفحص الآلي، وما راجعه مختص مستقل.',
              'يُذكر بوضوح ما راجعه المؤلف، وما راجعه مختص مستقل، وما لم يخضع بعد لمراجعة خارجية.',
          )

          replace_exact(
              'articles/index.html',
              '<title>مركز الأبحاث والملفات المعرفية | أحمد الحافظ</title>',
              '<title>مركز الأبحاث | أحمد الحافظ</title>',
          )
          replace_exact(
              'articles/index.html',
              '<meta property="og:title" content="مركز الأبحاث والملفات المعرفية">',
              '<meta property="og:title" content="مركز الأبحاث">',
          )
          replace_exact(
              'articles/index.html',
              '"name":"مركز الأبحاث والملفات المعرفية | أحمد الحافظ"',
              '"name":"مركز الأبحاث | أحمد الحافظ"',
          )
          replace_exact(
              'articles/index.html',
              '<h1>ملفات بحثية موثقة بالمصادر</h1>',
              '<h1>ملفات بحثية بمصادر قابلة للتتبع</h1>',
          )
          replace_exact(
              'articles/index.html',
              'ركيزة مرجعية ·',
              'ملف بحثي ·',
              expected=4,
          )

          replace_exact(
              'en/books/juhayman/index.html',
              'Official page for Juhayman — Kharijites Between the Rukn and the Maqam, Ahmed Alhafiz’s forthcoming historical religious novel about the 1979 Grand Mosque seizure and the paths of closed certainty.',
              'Official page for Ahmed Alhafiz’s forthcoming novel Juhayman — Kharijites Between the Rukn and the Maqam, about the 1979 Grand Mosque seizure.',
          )
          replace_exact(
              'de/books/juhayman/index.html',
              'Offizielle Seite zu Juhayman — Charidschiten zwischen Rukn und Maqam, einem historisch-religiösen Roman in Vorbereitung über die Besetzung der Großen Moschee 1979 und die geistigen Wege geschlossener Gewissheit.',
              'Offizielle Seite zu Ahmed Alhafiz’ Roman Juhayman — Charidschiten zwischen Rukn und Maqam über die Besetzung der Großen Moschee 1979.',
          )
          PY
          git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No cleanup changes produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Apply site-wide editorial credibility cleanup [editorial-cleanup]"
          git push origin HEAD:sitewide-editorial-credibility-20
