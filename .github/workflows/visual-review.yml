name: Visual review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start local static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ahmed-site-server.log 2>&1 &
          echo $! > /tmp/ahmed-site-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ahmed-site-server.log
          exit 1

      - name: Verify computed portrait geometry across all three languages
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$browser" ]]; then
            echo 'No Chromium-compatible browser is available on the runner.' >&2
            exit 1
          fi
          mkdir -p visual-review/geometry

          cat > visual-review/geometry-template.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><title>portrait geometry audit</title></head>
          <body data-done="false"><pre id="result">pending</pre>
          <script>
          const params = new URLSearchParams(location.search);
          const width = Number(params.get('width'));
          const height = Number(params.get('height'));
          const tests = [
            {name:'home-ar', path:'/', selector:'.hero-portrait'},
            {name:'home-en', path:'/en/', selector:'.hero-portrait'},
            {name:'home-de', path:'/de/', selector:'.hero-portrait'},
            {name:'about-ar', path:'/about/', selector:'.profile-portrait'},
            {name:'about-en', path:'/en/about/', selector:'.profile-portrait'},
            {name:'about-de', path:'/de/about/', selector:'.profile-portrait'}
          ];
          const round = value => Math.round(value * 100) / 100;
          const timeout = ms => new Promise((_, reject) => setTimeout(() => reject(new Error('iframe timeout')), ms));
          async function measure(test) {
            const frame = document.createElement('iframe');
            frame.style.cssText = `position:absolute;left:-20000px;top:0;width:${width}px;height:${height}px;border:0`;
            document.body.appendChild(frame);
            const loaded = new Promise((resolve, reject) => {
              frame.onload = resolve;
              frame.onerror = () => reject(new Error(`failed to load ${test.path}`));
            });
            frame.src = `${test.path}?geometry_audit=ux10`;
            await Promise.race([loaded, timeout(8000)]);
            const doc = frame.contentDocument;
            const box = doc.querySelector(test.selector);
            const image = box && box.querySelector('img');
            if (!box || !image) throw new Error(`${test.name}: portrait selector missing`);
            const boxRect = box.getBoundingClientRect();
            const imageRect = image.getBoundingClientRect();
            const style = frame.contentWindow.getComputedStyle(image);
            const result = {
              name: test.name,
              boxWidth: round(boxRect.width),
              boxHeight: round(boxRect.height),
              imageWidth: round(imageRect.width),
              imageHeight: round(imageRect.height),
              objectFit: style.objectFit,
              objectPosition: style.objectPosition
            };
            frame.remove();
            return result;
          }
          (async () => {
            try {
              const results = [];
              for (const test of tests) results.push(await measure(test));
              document.getElementById('result').textContent = JSON.stringify(results);
              document.body.dataset.done = 'true';
            } catch (error) {
              document.getElementById('result').textContent = JSON.stringify({error:String(error)});
              document.body.dataset.done = 'error';
            }
          })();
          </script></body></html>
          HTML

          for spec in 'desktop|1440|1200' 'mobile|390|844'; do
            mode="${spec%%|*}"
            rest="${spec#*|}"
            width="${rest%%|*}"
            height="${rest##*|}"
            "$browser" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --virtual-time-budget=18000 \
              --force-device-scale-factor=1 \
              --window-size="${width},${height}" \
              --dump-dom \
              "http://127.0.0.1:4173/visual-review/geometry-template.html?width=${width}&height=${height}" \
              > "visual-review/geometry/${mode}.html"
          done

          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import html
          import json

          class PreParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.in_pre = False
                  self.data = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'pre' and dict(attrs).get('id') == 'result':
                      self.in_pre = True
              def handle_endtag(self, tag):
                  if tag.lower() == 'pre' and self.in_pre:
                      self.in_pre = False
              def handle_data(self, data):
                  if self.in_pre:
                      self.data.append(data)

          reports = {}
          for mode in ('desktop', 'mobile'):
              parser = PreParser()
              parser.feed(Path(f'visual-review/geometry/{mode}.html').read_text(encoding='utf-8'))
              raw = html.unescape(''.join(parser.data)).strip()
              report = json.loads(raw)
              if isinstance(report, dict) and report.get('error'):
                  raise SystemExit(f'{mode}: browser geometry audit failed: {report["error"]}')
              reports[mode] = report
              Path(f'visual-review/geometry/{mode}.json').write_text(
                  json.dumps(report, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
              )

          for mode, report in reports.items():
              by_name = {item['name']: item for item in report}
              if len(by_name) != 6:
                  raise SystemExit(f'{mode}: expected six portrait measurements, found {len(by_name)}')
              for group in (('home-ar','home-en','home-de'), ('about-ar','about-en','about-de')):
                  widths = [by_name[name]['boxWidth'] for name in group]
                  heights = [by_name[name]['boxHeight'] for name in group]
                  if max(widths) - min(widths) > 1.5:
                      raise SystemExit(f'{mode}: cross-language portrait width drift: {dict(zip(group,widths))}')
                  if max(heights) - min(heights) > 1.5:
                      raise SystemExit(f'{mode}: cross-language portrait height drift: {dict(zip(group,heights))}')
              for name, item in by_name.items():
                  ratio = item['boxWidth'] / item['boxHeight']
                  if not 0.79 <= ratio <= 0.81:
                      raise SystemExit(f'{mode} {name}: portrait ratio is {ratio:.4f}, expected 4:5')
                  if abs(item['boxWidth'] - item['imageWidth']) > 1.5 or abs(item['boxHeight'] - item['imageHeight']) > 1.5:
                      raise SystemExit(f'{mode} {name}: image does not fill portrait frame')
                  if item['objectFit'] != 'cover':
                      raise SystemExit(f'{mode} {name}: object-fit is {item["objectFit"]!r}, expected cover')
          print('Portrait geometry is stable across Arabic, English and German at desktop and mobile widths')
          PY

      - name: Render multilingual hero contact book and footer states
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$browser" ]]; then
            echo 'No Chromium-compatible browser is available on the runner.' >&2
            exit 1
          fi
          mkdir -p visual-review/desktop visual-review/mobile visual-review/social

          pages=(
            'home-ar|/'
            'home-en|/en/'
            'home-de|/de/'
            'about-ar|/about/'
            'about-en|/en/about/'
            'about-de|/de/about/'
            'research-ar|/articles/'
            'research-en|/en/articles/'
            'ratq-ar|/articles/ratq-fatq-big-bang/'
            'ratq-en|/en/articles/ratq-fatq-big-bang/'
            'water-ar|/articles/water-civilization-power/'
            'water-en|/en/articles/water-civilization-power/'
            'sirou-ar|/books/sirou-fi-alard/'
            'sirou-en|/en/books/sirou-fi-alard/'
            'sirou-de|/de/books/sirou-fi-alard/'
            'umm-abbas-ar|/books/umm-abbas/'
            'umm-abbas-en|/en/books/umm-abbas/'
            'umm-abbas-de|/de/books/umm-abbas/'
            'juhayman-ar|/books/juhayman/'
            'juhayman-en|/en/books/juhayman/'
            'juhayman-de|/de/books/juhayman/'
            'kitab-al-kutub-ar|/books/kitab-al-kutub/'
            'kitab-al-kutub-en|/en/books/kitab-al-kutub/'
            'kitab-al-kutub-de|/de/books/kitab-al-kutub/'
            'home-ar-footer|/#site-footer'
            'home-en-footer|/en/#site-footer'
            'home-de-footer|/de/#site-footer'
            'about-ar-contact|/about/#contact'
            'about-en-contact|/en/about/#contact'
            'about-de-contact|/de/about/#contact'
          )

          for item in "${pages[@]}"; do
            name="${item%%|*}"
            route="${item#*|}"
            base="${route%%#*}"
            fragment=""
            if [[ "$route" == *'#'* ]]; then
              fragment="#${route#*#}"
            fi
            url="http://127.0.0.1:4173${base}?visual_review=ux10${fragment}"
            curl --fail --silent --show-error "http://127.0.0.1:4173${base}" > /dev/null

            "$browser" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --virtual-time-budget=3000 \
              --force-device-scale-factor=1 \
              --window-size=1440,1200 \
              --screenshot="visual-review/desktop/${name}.png" \
              "$url"

            "$browser" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --virtual-time-budget=3000 \
              --force-device-scale-factor=1 \
              --window-size=390,844 \
              --screenshot="visual-review/mobile/${name}.png" \
              "$url"
          done

          cp assets/social/water-civilization-power-ar.png visual-review/social/
          cp assets/social/water-civilization-power-en.png visual-review/social/

      - name: Verify screenshot dimensions files and social-card assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import struct

          expected = {
              'desktop': (1440, 1200),
              'mobile': (390, 844),
          }
          total = 0
          for mode, dimensions in expected.items():
              paths = sorted((Path('visual-review') / mode).glob('*.png'))
              if len(paths) != 30:
                  raise SystemExit(f'{mode}: expected 30 screenshots, found {len(paths)}')
              for path in paths:
                  data = path.read_bytes()
                  if data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
                      raise SystemExit(f'{path}: not a valid PNG')
                  width, height = struct.unpack('>II', data[16:24])
                  if (width, height) != dimensions:
                      raise SystemExit(f'{path}: expected {dimensions}, found {(width, height)}')
                  if len(data) < 5_000:
                      raise SystemExit(f'{path}: suspiciously small render ({len(data)} bytes)')
                  total += 1

          for mode in ('desktop', 'mobile'):
              report = json.loads((Path('visual-review/geometry') / f'{mode}.json').read_text(encoding='utf-8'))
              if len(report) != 6:
                  raise SystemExit(f'geometry/{mode}.json: expected six measurements')

          social = sorted((Path('visual-review') / 'social').glob('*.png'))
          expected_names = {
              'water-civilization-power-ar.png',
              'water-civilization-power-en.png',
          }
          if {path.name for path in social} != expected_names:
              raise SystemExit(f'social: expected {sorted(expected_names)}, found {[path.name for path in social]}')
          for path in social:
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
                  raise SystemExit(f'{path}: not a valid PNG')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != (1200, 630):
                  raise SystemExit(f'{path}: expected 1200x630, found {(width, height)}')
              if len(data) < 10_000:
                  raise SystemExit(f'{path}: suspiciously small social card ({len(data)} bytes)')

          print(f'Verified {total} multilingual page screenshots, two geometry reports and {len(social)} social cards')
          PY

      - name: Upload visual review artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-ux-rebuild-10-visual-review
          path: visual-review
          retention-days: 14
          if-no-files-found: error
