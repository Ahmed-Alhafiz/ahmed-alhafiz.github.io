name: Visual review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser automation dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet "selenium>=4.25,<5"
          python -c "import selenium; print('Selenium', selenium.__version__)"
          google-chrome --version || chromium --version || chromium-browser --version
          chromedriver --version || true

      - name: Start local static server
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/ahmed-site-server.log 2>&1 &
          echo $! > /tmp/ahmed-site-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ahmed-site-server.log
          exit 1

      - name: Render and verify multilingual responsive states
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .github/visual-review/run_visual_review.py
          python .github/visual-review/run_visual_review.py

      - name: Upload visual review artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-ux-rebuild-10-visual-review
          path: visual-review
          retention-days: 14
          if-no-files-found: error
