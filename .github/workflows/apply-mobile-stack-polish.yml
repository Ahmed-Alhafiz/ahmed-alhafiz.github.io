name: Apply mobile stacking polish

on:
  push:
    branches:
      - site-ux-rebuild-10
    paths:
      - .github/mobile-stack-polish.trigger

permissions:
  contents: write

concurrency:
  group: mobile-stack-polish
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply mobile single-column stacking and interface polish
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .github/mobile-stack-polish.trigger)" = 'run=1'
          python .github/mobile-stack-polish.py
          rm -f .github/mobile-stack-polish.py
          rm -f .github/mobile-stack-polish.trigger

      - name: Run full structural editorial discovery and UX verification
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/apply-mobile-stack-polish.yml'
          parked='/tmp/apply-mobile-stack-polish.yml'
          mv "$workflow" "$parked"
          trap 'mv "$parked" "$workflow" 2>/dev/null || true' EXIT
          python -m py_compile tools/site_audit.py tools/editorial_quality_gate.py tools/discovery_integrity.py tools/ux_integrity.py
          python tools/site_audit.py
          python tools/editorial_quality_gate.py
          python tools/discovery_integrity.py
          python tools/ux_integrity.py
          git diff --check
          mv "$parked" "$workflow"
          trap - EXIT
          test ! -e .github/mobile-stack-polish.py
          test ! -e .github/mobile-stack-polish.trigger

      - name: Commit verified polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ahmed-Alhafiz'
          git config user.email 'hhafz9924@gmail.com'
          git add -A
          git commit -m 'Fix mobile hero stacking and polish Arabic interface labels'
          if ! git push origin HEAD:site-ux-rebuild-10; then
            git pull --rebase origin site-ux-rebuild-10
            git push origin HEAD:site-ux-rebuild-10
          fi
