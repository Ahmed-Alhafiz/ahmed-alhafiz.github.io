name: Content research architecture

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile the architecture gate
        run: python -m py_compile tools/content_research_architecture_integrity.py

      - name: Parse registers and measure verification records and drafts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          planning = json.loads(
              Path('.github/teaching_names_ai_source_register.json').read_text(encoding='utf-8')
          )
          verified = json.loads(
              Path('.github/teaching_names_ai_verified_claims.json').read_text(encoding='utf-8')
          )
          paths = {
              'tafsir verification': Path('.github/TEACHING_NAMES_TAFSIR_VERIFICATION_2026-09-03.md'),
              'technical verification': Path('.github/TEACHING_NAMES_TECHNICAL_VERIFICATION_2026-09-03.md'),
              'Qur\'anic draft': Path('.github/drafts/TEACHING_NAMES_ARABIC_DRAFT_01_QURANIC_UNIT.md'),
              'technical draft': Path('.github/drafts/TEACHING_NAMES_ARABIC_DRAFT_02_TECHNICAL_UNIT.md'),
          }
          words = lambda text: len(re.findall(r'[\w\u0600-\u06FF]+', text, flags=re.UNICODE))

          print(
              f"Retired planning register: status={planning['status']}, "
              f"publication_state={planning['publication_state']}"
          )
          print(
              f"Verified register: {len(verified['claims'])} claims, "
              f"{len(verified['sources'])} sources, "
              f"publication_state={verified['publication_state']}"
          )
          for label, path in paths.items():
              text = path.read_text(encoding='utf-8')
              print(f"{label}: {words(text)} words; {len(text)} characters")
          PY

      - name: Validate reference-grade tafsir technical evidence reciprocity and drafts
        run: python tools/content_research_architecture_integrity.py

      - name: Reject false publication review and manuscript-evidence states
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          planning = json.loads(
              Path('.github/teaching_names_ai_source_register.json').read_text(encoding='utf-8')
          )
          verified = json.loads(
              Path('.github/teaching_names_ai_verified_claims.json').read_text(encoding='utf-8')
          )

          if planning['status'] != 'superseded_by_verified_claim_register':
              raise SystemExit('Retired planning register is not quarantined.')
          if planning['publication_state'] != 'article_not_yet_rewritten_or_published':
              raise SystemExit('Retired planning register falsely claims a public rewrite.')
          if planning['pillar']['thematic_origin']['relationship'] != 'question_origin_only_not_empirical_evidence':
              raise SystemExit('Retired planning register promoted the manuscript to evidence.')
          if planning['pillar']['external_review'] != 'not_completed':
              raise SystemExit('Retired planning register falsely claims external review.')
          if verified['publication_state'] != 'not_public_not_merged':
              raise SystemExit('Verified register falsely claims publication or merge.')
          if verified['pillar']['thematic_origin']['evidentiary_role'] != 'question_origin_only':
              raise SystemExit('Verified register promoted the manuscript to evidence.')
          if verified['pillar']['external_review'] != 'not_completed':
              raise SystemExit('Verified register falsely claims external review.')
          print('Publication, review, and manuscript/evidence boundaries are explicit.')
          PY

      - name: Reject ChatGPT-only citation syntax in repository drafts
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --fixed-strings 'filecite' .github/drafts; then
            echo 'ChatGPT-only file citation syntax must not be stored in repository drafts.' >&2
            exit 1
          fi
          echo 'No ChatGPT-only citation syntax found in repository drafts.'

      - name: Check patch whitespace
        run: git diff --check
