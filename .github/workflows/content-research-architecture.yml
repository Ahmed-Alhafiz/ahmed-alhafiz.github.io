name: Content research architecture

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile the architecture gate
        run: python -m py_compile tools/content_research_architecture_integrity.py

      - name: Parse planning and verified claim-evidence registers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          planning = json.loads(
              Path('.github/teaching_names_ai_source_register.json').read_text(encoding='utf-8')
          )
          verified = json.loads(
              Path('.github/teaching_names_ai_verified_claims.json').read_text(encoding='utf-8')
          )
          print(
              f"Planning register: {len(planning['claims'])} claims, "
              f"{len(planning['sources'])} sources, status={planning['status']}"
          )
          print(
              f"Verified register: {len(verified['claims'])} claims, "
              f"{len(verified['sources'])} sources, publication_state={verified['publication_state']}"
          )
          PY

      - name: Validate reference-grade architecture primary tafsir corrections and reciprocity
        run: python tools/content_research_architecture_integrity.py

      - name: Reject false publication review and manuscript-evidence states
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          planning = json.loads(
              Path('.github/teaching_names_ai_source_register.json').read_text(encoding='utf-8')
          )
          verified = json.loads(
              Path('.github/teaching_names_ai_verified_claims.json').read_text(encoding='utf-8')
          )
          if planning['status'] != 'research_architecture_complete_article_not_yet_rewritten':
              raise SystemExit('Planning register falsely claims a public rewrite.')
          if planning['pillar']['thematic_origin']['relationship'] != 'thematic_origin_not_empirical_evidence':
              raise SystemExit('Planning register promoted the manuscript to empirical evidence.')
          if verified['publication_state'] != 'not_public_not_merged':
              raise SystemExit('Verified register falsely claims publication or merge.')
          if verified['pillar']['thematic_origin']['evidentiary_role'] != 'question_origin_only':
              raise SystemExit('Verified register promoted the manuscript to evidence.')
          if verified['pillar']['external_review'] != 'not_completed':
              raise SystemExit('Verified register falsely claims external review.')
          print('Publication, review, and manuscript/evidence boundaries are explicit.')
          PY

      - name: Check patch whitespace
        run: git diff --check
