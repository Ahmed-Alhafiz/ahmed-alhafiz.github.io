name: Apply global editorial rebuild 07 v2

on:
  push:
    branches:
      - global-editorial-rebuild-07
    paths:
      - .github/gr07/APPLY4

permissions:
  contents: write

concurrency:
  group: global-editorial-rebuild-07-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify reviewed release archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/gr07/APPLY4
          mapfile -t parts < <(find .github/gr07 -maxdepth 1 -type f -name 'part-*' | sort)
          echo "Found ${#parts[@]} release segments"
          printf '%s\n' "${parts[@]}"
          cat "${parts[@]}" > /tmp/global-rebuild-07.tgz.b64
          actual_size="$(wc -c < /tmp/global-rebuild-07.tgz.b64 | tr -d ' ')"
          actual_b64_sha="$(sha256sum /tmp/global-rebuild-07.tgz.b64 | cut -d' ' -f1)"
          echo "Base64 size: ${actual_size}"
          echo "Base64 sha256: ${actual_b64_sha}"
          test "$actual_size" -eq 124420
          base64 --decode /tmp/global-rebuild-07.tgz.b64 > /tmp/global-rebuild-07.tgz
          echo 'c8606e6113e0b340c707b7d73db56aa906733b7f2c04dea07bafda4993898fc7  /tmp/global-rebuild-07.tgz' | sha256sum --check --strict
          if tar -tzf /tmp/global-rebuild-07.tgz | grep -E '(^/|(^|/)\.\.(/|$))'; then
            echo 'Unsafe archive path detected' >&2
            exit 1
          fi
          echo 'Archive reconstruction and integrity verification passed.'

      - name: Install global editorial and research architecture
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/global-rebuild-07.tgz -C .
          rm -rf .github/gr07
          rm -f .github/workflows/apply-global-editorial-rebuild-07.yml
          rm -f .github/workflows/apply-global-editorial-rebuild-07-v2.yml
          rm -f .github/workflows/diagnose-global-editorial-rebuild-07.yml

      - name: Parse structured data feeds and machine-readable evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/site_audit.py tools/editorial_quality_gate.py
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path

          class JsonLdParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.active = False
                  self.buf = []
                  self.blocks = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag.lower() == 'script' and attrs.get('type', '').lower() == 'application/ld+json':
                      self.active = True
                      self.buf = []
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.active:
                      self.blocks.append(''.join(self.buf))
                      self.active = False
              def handle_data(self, data):
                  if self.active:
                      self.buf.append(data)

          for path in [Path('sitemap.xml'), Path('articles/feed.xml'), Path('en/articles/feed.xml')]:
              ET.parse(path)

          for path in [
              Path('articles/feed.json'),
              Path('en/articles/feed.json'),
              Path('research/index.json'),
              Path('articles/ratq-fatq-big-bang/evidence/claims.json'),
              Path('en/articles/ratq-fatq-big-bang/evidence/claims.json'),
          ]:
              json.loads(path.read_text(encoding='utf-8'))

          page_count = 0
          block_count = 0
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              parser = JsonLdParser()
              parser.feed(path.read_text(encoding='utf-8'))
              for block in parser.blocks:
                  if block.strip():
                      json.loads(block)
                      block_count += 1
              page_count += 1
          print(f'Parsed {page_count} HTML pages and {block_count} JSON-LD blocks; XML and JSON evidence passed.')
          PY

      - name: Run complete site and editorial quality gates
        shell: bash
        run: |
          set -euo pipefail
          python tools/site_audit.py
          python tools/editorial_quality_gate.py
          git diff --check
          test ! -e .github/gr07
          test ! -e .github/workflows/apply-global-editorial-rebuild-07.yml
          test ! -e .github/workflows/apply-global-editorial-rebuild-07-v2.yml
          test ! -e .github/workflows/diagnose-global-editorial-rebuild-07.yml

      - name: Commit verified rebuild to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ahmed-Alhafiz'
          git config user.email 'hhafz9924@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No rebuild changes remain to commit.'
            exit 0
          fi
          git commit -m 'Apply global editorial and research rebuild'
          if ! git push origin HEAD:global-editorial-rebuild-07; then
            git pull --rebase origin global-editorial-rebuild-07
            git push origin HEAD:global-editorial-rebuild-07
          fi