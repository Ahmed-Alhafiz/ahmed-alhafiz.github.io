name: Apply Water Civilization Power 09

on:
  push:
    branches:
      - water-civilization-power-09
    paths:
      - .github/water09/APPLY

permissions:
  contents: write

concurrency:
  group: water-civilization-power-09
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify reviewed release archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/water09/APPLY
          parts=(
            .github/water09/part-00
            .github/water09/part-01
            .github/water09/part-02
            .github/water09/part-034
            .github/water09/part-056
          )
          for part in "${parts[@]}"; do test -s "$part"; done
          cat "${parts[@]}" > /tmp/water09-release.tar.xz.b64
          test "$(wc -c < /tmp/water09-release.tar.xz.b64 | tr -d ' ')" -eq 63260
          echo 'c62f76f1efeb27a12082305c3ba98a70bb1e6c4b3d00e8a211476eb4697be403  /tmp/water09-release.tar.xz.b64' | sha256sum --check --strict
          base64 --decode /tmp/water09-release.tar.xz.b64 > /tmp/water09-release.tar.xz
          echo '2a17ea1675bc8a8b1930c5f07cbcf7cc07f898a467c9fd2de2227b37fff8c014  /tmp/water09-release.tar.xz' | sha256sum --check --strict
          python - <<'PY'
          from pathlib import PurePosixPath
          import tarfile

          archive = '/tmp/water09-release.tar.xz'
          with tarfile.open(archive, 'r:xz') as bundle:
              members = bundle.getmembers()
              if not members:
                  raise SystemExit('Release archive is empty')
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe archive path: {member.name}')
              print(f'Archive path audit passed for {len(members)} members')
          PY

      - name: Install dossier and apply reviewed integration patch
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/water09-release.tar.xz -C .
          python -m py_compile tools/apply_water09_release.py
          python tools/apply_water09_release.py
          rm -f tools/apply_water09_release.py
          rm -rf tools/__pycache__
          rm -rf .github/water09

      - name: Parse all structured and machine-readable outputs
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/site_audit.py tools/editorial_quality_gate.py tools/discovery_integrity.py
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path

          class JsonLdParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.active = False
                  self.buffer = []
                  self.blocks = []
              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)
                  if tag.lower() == 'script' and attributes.get('type', '').lower() == 'application/ld+json':
                      self.active = True
                      self.buffer = []
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.active:
                      self.blocks.append(''.join(self.buffer))
                      self.active = False
              def handle_data(self, data):
                  if self.active:
                      self.buffer.append(data)

          xml_files = [
              Path('sitemap.xml'),
              Path('articles/feed.xml'),
              Path('en/articles/feed.xml'),
              Path('assets/figures/water-power-justice-chain-ar.svg'),
              Path('assets/figures/water-power-justice-chain-en.svg'),
          ]
          json_files = [
              Path('articles/feed.json'),
              Path('en/articles/feed.json'),
              Path('articles/research-index.json'),
              Path('articles/ratq-fatq-big-bang/evidence/claims.json'),
              Path('articles/water-civilization-power/evidence/claims.json'),
          ]
          for path in xml_files:
              ET.parse(path)
          for path in json_files:
              json.loads(path.read_text(encoding='utf-8'))

          pages = blocks = 0
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              parser = JsonLdParser()
              parser.feed(path.read_text(encoding='utf-8'))
              for block in parser.blocks:
                  if block.strip():
                      json.loads(block)
                      blocks += 1
              pages += 1
          print(f'Parsed {pages} HTML pages, {blocks} JSON-LD blocks, {len(xml_files)} XML/SVG files and {len(json_files)} JSON files')
          PY

      - name: Run complete structural editorial and discovery gates
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/apply-water-civilization-power-09.yml'
          parked='/tmp/apply-water-civilization-power-09.yml'
          mv "$workflow" "$parked"
          trap 'mv "$parked" "$workflow" 2>/dev/null || true' EXIT
          python tools/site_audit.py
          python tools/editorial_quality_gate.py
          python tools/discovery_integrity.py
          mv "$parked" "$workflow"
          trap - EXIT
          git diff --check
          test ! -e .github/water09
          test ! -e tools/apply_water09_release.py
          test -e .github/workflows/apply-water-civilization-power-09.yml

      - name: Commit verified dossier integration to review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ahmed-Alhafiz'
          git config user.email 'hhafz9924@gmail.com'
          git add -A
          git commit -m 'Publish Water Civilization and Power research dossier'
          if ! git push origin HEAD:water-civilization-power-09; then
            git pull --rebase origin water-civilization-power-09
            git push origin HEAD:water-civilization-power-09
          fi
