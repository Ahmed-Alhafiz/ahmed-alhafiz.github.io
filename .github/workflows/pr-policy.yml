name: PR policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: "PR policy / policy"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout current protected base policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Capture trusted current base tip
        shell: bash
        run: echo "PROTECTED_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Fetch proposed head without executing it
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.clone_url }}
        run: |
          set -euo pipefail
          git fetch --no-tags "$HEAD_REPO" "$HEAD_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
      - name: Validate pull request policy from current protected base
        run: python3 .github/governance/pr_policy.py
