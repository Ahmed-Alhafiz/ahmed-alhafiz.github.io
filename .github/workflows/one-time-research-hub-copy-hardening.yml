name: One-time research hub copy hardening

on:
  push:
    branches:
      - research-hub-copy-hardening-22

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[research-hub-copy-hardening]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-hub-copy-hardening-22
          fetch-depth: 0

      - name: Apply exact public copy corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path_str, old, new, expected=1):
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          en = 'en/articles/index.html'
          replace_exact(
              en,
              'The research desk of Ahmed Alhafiz: Arabic and English dossiers with explicit claims, evidence, limits, sources, versions, and review status.',
              'The research collection of Ahmed Alhafiz: Arabic and English dossiers with clear claims, sources, limits, versions, and review status.',
          )
          replace_exact(
              en,
              'The English research desk of Ahmed Alhafiz.',
              'The English research collection of Ahmed Alhafiz.',
          )
          replace_exact(
              en,
              '<div class="kicker">Independent research desk</div><h1>Arguments designed to be inspected</h1><p>Each dossier separates the question, evidence, inference, limitations, and review state. The aim is not to imitate institutional authority, but to make every important conclusion easier to verify, challenge, and cite accurately.</p>',
              '<div class="kicker">Research by Ahmed Alhafiz</div><h1>Research with sources, limits, and review status</h1><p>Each dossier separates the question, evidence, inference, limitations, and review status so readers can see what is supported, what remains uncertain, and where each conclusion comes from.</p>',
          )
          replace_exact(en, 'Reference dossier ·', 'Research dossier ·', expected=4)
          replace_exact(
              en,
              '<div class="kicker">Publication model</div><h2>Three labels with different evidentiary weight</h2>',
              '<div class="kicker">Research formats</div><h2>Different formats for different questions</h2>',
          )
          replace_exact(
              en,
              '<div class="kicker">Editorial standard</div><h2>English editions are released only at full argumentative depth</h2>',
              '<div class="kicker">English editions</div><h2>Full English editions preserve the full argument</h2>',
          )
          replace_exact(en, '<a class="btn" href="/articles/">المكتب العربي</a>', '<a class="btn" href="/articles/">الأبحاث بالعربية</a>')
          replace_exact(en, 'Official home of the books and evidence-led research dossiers.', 'Official home of the books and published research.')

          de = 'de/index.html'
          replace_exact(de, '<span class="track-no">COSMOLOGY</span>', '<span class="track-no">KOSMOLOGIE</span>')
          replace_exact(de, '<span class="track-no">WATER / POWER</span>', '<span class="track-no">WASSER / MACHT</span>')

          hygiene = Path('tools/public_presentation_hygiene.py')
          text = hygiene.read_text(encoding='utf-8')
          marker = '''    Path("en/about/index.html"): ('''
          insert = '''    Path("en/articles/index.html"): (\n        "Independent research desk",\n        "Arguments designed to be inspected",\n        "The aim is not to imitate institutional authority",\n        "Reference dossier ·",\n        "Three labels with different evidentiary weight",\n        "English editions are released only at full argumentative depth",\n        "المكتب العربي",\n    ),\n'''
          if text.count(marker) != 1:
              raise SystemExit('tools/public_presentation_hygiene.py: EN about marker drift')
          if 'Path("en/articles/index.html")' in text:
              raise SystemExit('tools/public_presentation_hygiene.py: EN articles block already exists')
          text = text.replace(marker, insert + marker)
          old_de = '''    Path("de/index.html"): (\n        "Offizielle Autoren- und Forschungsplattform",\n        "Vollständige Forschungsfassungen",\n        "automatisierte Kontrolle",\n    ),'''
          new_de = '''    Path("de/index.html"): (\n        "Offizielle Autoren- und Forschungsplattform",\n        "Vollständige Forschungsfassungen",\n        "automatisierte Kontrolle",\n        "COSMOLOGY",\n        "WATER / POWER",\n    ),'''
          if text.count(old_de) != 1:
              raise SystemExit('tools/public_presentation_hygiene.py: DE homepage block drift')
          text = text.replace(old_de, new_de)
          hygiene.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Verify corrected copy before commit
        shell: bash
        run: |
          set -euo pipefail
          python tools/public_presentation_hygiene.py
          python - <<'PY'
          from pathlib import Path
          en = Path('en/articles/index.html').read_text(encoding='utf-8')
          de = Path('de/index.html').read_text(encoding='utf-8')
          required_en = [
              'Research by Ahmed Alhafiz',
              'Research with sources, limits, and review status',
              'Research formats',
              'Different formats for different questions',
              'Full English editions preserve the full argument',
              'الأبحاث بالعربية',
          ]
          for token in required_en:
              if token not in en:
                  raise SystemExit(f'en/articles/index.html: missing corrected token {token!r}')
          for token in ('KOSMOLOGIE', 'WASSER / MACHT'):
              if token not in de:
                  raise SystemExit(f'de/index.html: missing localized token {token!r}')
          print('Research-hub copy hardening verification passed.')
          PY

      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add en/articles/index.html de/index.html tools/public_presentation_hygiene.py
          git commit -m 'Naturalize research hub public copy [research-hub-copy-hardening]'
          git push origin HEAD:research-hub-copy-hardening-22
