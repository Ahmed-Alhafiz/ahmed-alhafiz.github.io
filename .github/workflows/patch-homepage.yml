name: Patch homepage discovery paths

on:
  push:
    branches:
      - main
    paths:
      - ".github/homepage-patch.marker"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact reviewed homepage patch
        run: |
          python tools/patch_homepage.py
          rm .github/homepage-patch.marker
          python tools/site_audit.py
          git diff --check
      - name: Commit homepage discovery improvements
        run: |
          git config user.name "Ahmed-Alhafiz"
          git config user.email "hhafz9924@gmail.com"
          git add -A
          git commit -m "Connect homepage to reference articles and book pages"
          git push
