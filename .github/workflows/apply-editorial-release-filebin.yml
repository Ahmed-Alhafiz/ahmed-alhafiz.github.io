name: Apply verified editorial reference release

on:
  push:
    branches: [main]
    paths:
      - .github/editorial-release-filebin.manifest

permissions:
  contents: write

concurrency:
  group: editorial-reference-release
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/editorial-release-filebin.manifest
          grep -Fxq 'sha256=1883a95662a97e9c9bcf10938cf51438b92363a93d111af921e714188ca8366d' .github/editorial-release-filebin.manifest
          grep -Fxq 'release=editorial-reference-03' .github/editorial-release-filebin.manifest

      - name: Download and verify reviewed release archive
        shell: bash
        run: |
          set -euo pipefail
          url='https://filebin.net/ahmed-editorial-20260901-a7c914e3/editorial-release-03.tgz'
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 "$url" -o /tmp/editorial-release-03.tgz
          echo '1883a95662a97e9c9bcf10938cf51438b92363a93d111af921e714188ca8366d  /tmp/editorial-release-03.tgz' | sha256sum --check --strict
          if tar -tzf /tmp/editorial-release-03.tgz | grep -E '(^/|(^|/)\.\.(/|$))'; then
            echo 'Unsafe archive path detected' >&2
            exit 1
          fi

      - name: Install reviewed pages and infrastructure
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/editorial-release-03.tgz -C .

          if ! grep -Fq '/articles/six-days-creation-cosmic-time/' index.html; then
            python .github/EDITORIAL_RELEASE_PATCH.py
          else
            echo 'Homepage release patch is already present; preserving it.'
          fi

          python - <<'PY'
          from pathlib import Path
          ledger = Path('.github/SEO_OPERATIONS_LEDGER.md')
          addition = Path('.github/SEO_LEDGER_APPEND.md')
          current = ledger.read_text(encoding='utf-8')
          block = addition.read_text(encoding='utf-8').strip()
          if block and block not in current:
              ledger.write_text(current.rstrip() + '\n\n' + block + '\n', encoding='utf-8')
              print('Ledger entry appended.')
          else:
              print('Ledger entry already present; no duplicate added.')
          PY

          rm -f .github/EDITORIAL_RELEASE_PATCH.py .github/SEO_LEDGER_APPEND.md
          rm -f .github/editorial-release-filebin.manifest
          rm -f .github/editorial-release-03.manifest .github/editorial-release-03.part-*
          rm -f .github/content-bundle.manifest .github/content-bundle.tgz.b64 .github/content-bundle.part-*
          rm -f .github/test-bridge.txt .github/bridge-path-test.txt
          rm -f .github/workflows/apply-editorial-release-03.yml
          rm -f .github/workflows/apply-content-bundle.yml
          rm -f .github/workflows/apply-editorial-release-filebin.yml

      - name: Run complete release verification
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/site_audit.py tools/editorial_quality_gate.py
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path

          class JsonLdParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.active = False
                  self.buf = []
                  self.blocks = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag.lower() == 'script' and attrs.get('type', '').lower() == 'application/ld+json':
                      self.active = True
                      self.buf = []
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.active:
                      self.blocks.append(''.join(self.buf))
                      self.active = False
              def handle_data(self, data):
                  if self.active:
                      self.buf.append(data)

          ET.parse('sitemap.xml')
          ET.parse('articles/feed.xml')
          count = 0
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              parser = JsonLdParser()
              parser.feed(path.read_text(encoding='utf-8'))
              for block in parser.blocks:
                  if block.strip():
                      json.loads(block)
              count += 1
          print(f'Parsed {count} HTML pages plus JSON-LD and XML successfully.')
          PY
          python tools/site_audit.py
          python tools/editorial_quality_gate.py
          git diff --check
          test ! -e .github/EDITORIAL_RELEASE_PATCH.py
          test ! -e .github/SEO_LEDGER_APPEND.md
          test ! -e .github/editorial-release-filebin.manifest

      - name: Commit and push verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ahmed-Alhafiz'
          git config user.email 'hhafz9924@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No release changes remain to commit.'
            exit 0
          fi
          git commit -m 'Publish second reference research release'
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
