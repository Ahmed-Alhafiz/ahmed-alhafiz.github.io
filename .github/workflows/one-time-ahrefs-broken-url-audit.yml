name: One-time Ahrefs title meta audit

on:
  push:
    branches:
      - ahrefs-final-cleanup-26

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure canonical titles and descriptions
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          class P(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=True); self.t=False; self.title=''; self.desc=''; self.canon=''
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs); tag=tag.lower()
                  if tag=='title': self.t=True
                  elif tag=='meta' and a.get('name','').lower()=='description': self.desc=a.get('content','').strip()
                  elif tag=='link' and 'canonical' in a.get('rel','').lower().split(): self.canon=a.get('href','').strip()
              def handle_endtag(self,tag):
                  if tag.lower()=='title': self.t=False
              def handle_data(self,data):
                  if self.t:self.title+=data
          rows=[]
          for f in sorted(Path('.').rglob('*.html')):
              if '.git' in f.parts or f.as_posix()=='404.html' or f.name.startswith('google'): continue
              p=P()
              try:p.feed(f.read_text(encoding='utf-8'))
              except Exception:continue
              title=re.sub(r'\s+',' ',p.title).strip(); desc=re.sub(r'\s+',' ',p.desc).strip()
              if p.canon: rows.append((f.as_posix(),len(title),len(desc),title,desc))
          print('CANONICAL_PAGES',len(rows))
          for tlim,dlim in [(60,155),(65,160),(70,160),(70,165),(75,160)]:
              print(f'THRESHOLD title>{tlim}={sum(t>tlim for _,t,d,_,_ in rows)} desc>{dlim}={sum(d>dlim for _,t,d,_,_ in rows)}')
          print('--- TITLES SORTED ---')
          for path,t,d,title,desc in sorted(rows,key=lambda x:(-x[1],x[0])):
              print(f'TITLE|{t}|{path}|{title}')
          print('--- DESCRIPTIONS SORTED ---')
          for path,t,d,title,desc in sorted(rows,key=lambda x:(-x[2],x[0])):
              print(f'DESC|{d}|{path}|{desc}')
          PY
