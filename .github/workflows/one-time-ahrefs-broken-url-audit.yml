name: One-time Ahrefs broken URL audit

on:
  push:
    branches:
      - ahrefs-final-cleanup-26

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find missing internal targets across repository text and live site
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          import re

          BASE='https://ahmed-alhafiz.github.io'
          root=Path('.').resolve()
          text_ext={'.html','.xml','.json','.jsonld','.js','.css','.md','.txt','.rss','.atom'}
          abs_re=re.compile(r'https://ahmed-alhafiz\.github\.io(?:/[A-Za-z0-9_./%\-]+)?')
          refs=[]
          for f in sorted(root.rglob('*')):
              if not f.is_file() or '.git' in f.parts or f.suffix.lower() not in text_ext: continue
              try: txt=f.read_text(encoding='utf-8')
              except Exception: continue
              for m in abs_re.finditer(txt):
                  refs.append((f,m.group(0)))

          uniq={u for _,u in refs}
          missing_local=[]
          live_bad=[]
          for u in sorted(uniq):
              pth=unquote(urlsplit(u).path)
              p=root/pth.lstrip('/')
              if not pth or pth=='/': p=root/'index.html'
              elif pth.endswith('/'): p=p/'index.html'
              elif p.is_dir(): p=p/'index.html'
              if not p.exists():
                  missing_local.append((u, str(p.relative_to(root)) if p.is_relative_to(root) else str(p)))
              try:
                  req=Request(u, headers={'User-Agent':'Mozilla/5.0 Ahrefs-remediation-check'})
                  with urlopen(req, timeout=15) as r:
                      code=getattr(r,'status',200)
                      final=r.geturl()
                  if not (200 <= code < 400): live_bad.append((u,code,final))
              except HTTPError as e:
                  live_bad.append((u,e.code,getattr(e,'url',u)))
              except URLError as e:
                  print('LIVE_ERROR',u,repr(e.reason))

          print(f'ABS_INTERNAL_URLS={len(uniq)}')
          print(f'MISSING_LOCAL_TARGETS={len(missing_local)}')
          for u,p in missing_local: print(f'MISSING_LOCAL|{u}|{p}')
          print(f'LIVE_NON_2XX_3XX={len(live_bad)}')
          for u,c,f in live_bad: print(f'LIVE_BAD|{c}|{u}|{f}')
          PY
