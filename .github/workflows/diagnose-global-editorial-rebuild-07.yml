name: Diagnose global editorial rebuild 07 segments

on:
  push:
    branches:
      - global-editorial-rebuild-07
    paths:
      - .github/gr07/DIAG

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every release segment independently
        shell: bash
        run: |
          set -uo pipefail
          find .github/gr07 -maxdepth 1 -type f -name 'part-*' -printf '%f %s bytes\n' | sort
