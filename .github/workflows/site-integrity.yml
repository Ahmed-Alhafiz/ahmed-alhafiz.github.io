name: Site integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile audit tools
        run: python -m py_compile tools/site_audit.py tools/editorial_quality_gate.py tools/discovery_integrity.py tools/ux_integrity.py tools/arabic_ui_integrity.py tools/dossier11_integrity.py

      - name: Parse XML JSON feeds evidence manifests figures and every JSON-LD block
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path

          class JsonLdParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.active = False
                  self.buffer = []
                  self.blocks = []

              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)
                  if tag.lower() == "script" and attributes.get("type", "").lower() == "application/ld+json":
                      self.active = True
                      self.buffer = []

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.active:
                      self.blocks.append("".join(self.buffer))
                      self.active = False

              def handle_data(self, data):
                  if self.active:
                      self.buffer.append(data)

          xml_files = [
              Path("sitemap.xml"),
              Path("articles/feed.xml"),
              Path("en/articles/feed.xml"),
              *sorted(Path("assets/figures").glob("*.svg")),
          ]
          json_files = [
              Path("articles/feed.json"),
              Path("en/articles/feed.json"),
              Path("articles/research-index.json"),
              *sorted(Path("articles").glob("*/evidence/claims.json")),
          ]

          for path in xml_files:
              ET.parse(path)
          for path in json_files:
              json.loads(path.read_text(encoding="utf-8"))

          pages = blocks = 0
          for path in Path(".").rglob("*.html"):
              if ".git" in path.parts:
                  continue
              parser = JsonLdParser()
              parser.feed(path.read_text(encoding="utf-8"))
              for block in parser.blocks:
                  if block.strip():
                      json.loads(block)
                      blocks += 1
              pages += 1

          print(
              f"Parsed {pages} HTML files, {blocks} JSON-LD blocks, "
              f"{len(xml_files)} XML/SVG outputs and {len(json_files)} JSON outputs"
          )
          PY

      - name: Validate visible language switchers against hreflang alternates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import re

          alternate_re = re.compile(
              r'<link\b[^>]*\brel=["\']alternate["\'][^>]*\bhreflang=["\']([^"\']+)["\'][^>]*\bhref=["\']([^"\']+)["\'][^>]*>',
              re.IGNORECASE,
          )
          langs_re = re.compile(
              r'<div\b[^>]*\bclass=["\'][^"\']*\blangs\b[^"\']*["\'][^>]*>(.*?)</div>',
              re.IGNORECASE | re.DOTALL,
          )
          anchor_re = re.compile(
              r'<a\b[^>]*\bhref=["\']([^"\']+)["\'][^>]*\bhreflang=["\']([^"\']+)["\'][^>]*>',
              re.IGNORECASE,
          )

          def local_path(url: str) -> str:
              parsed = urlparse(url)
              path = parsed.path if parsed.scheme else url.split('#', 1)[0].split('?', 1)[0]
              if not path.startswith('/'):
                  path = '/' + path
              return path

          errors = []
          checked = 0
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              html = path.read_text(encoding='utf-8')
              alternates = {
                  lang.lower(): local_path(href)
                  for lang, href in alternate_re.findall(html)
                  if lang.lower() in {'ar', 'en', 'de'}
              }
              match = langs_re.search(html)
              if not alternates or not match:
                  continue
              switches = {
                  lang.lower(): local_path(href)
                  for href, lang in anchor_re.findall(match.group(1))
                  if lang.lower() in {'ar', 'en', 'de'}
              }
              for lang, expected in alternates.items():
                  actual = switches.get(lang)
                  if actual != expected:
                      errors.append(
                          f'{path}: visible {lang} switch is {actual!r}; hreflang requires {expected!r}'
                      )
              checked += 1

          if errors:
              print('\n'.join(errors))
              raise SystemExit(1)
          print(f'Validated visible language switchers on {checked} multilingual pages')
          PY

      - name: Validate HTML links sitemap feeds hreflang and publication safety
        run: python tools/site_audit.py

      - name: Validate evidence depth transparency linking and medical safeguards
        run: python tools/editorial_quality_gate.py

      - name: Validate feed chronology research index hub sitemap and reciprocal book graph
        run: python tools/discovery_integrity.py

      - name: Validate fear-before-diagnosis bilingual dossier evidence and safety package
        run: python tools/dossier11_integrity.py

      - name: Validate multilingual UX portrait footer contact covers and public identity integrity
        run: python tools/ux_integrity.py

      - name: Validate Arabic interface localization and publication register structure
        run: python tools/arabic_ui_integrity.py

      - name: Reject temporary release machinery
        shell: bash
        run: |
          set -euo pipefail
          if find .github -maxdepth 3 -type f \( \
              -name 'APPLY*' -o \
              -name 'part-*' -o \
              -name 'fix-*' -o \
              -name '*.trigger' -o \
              -name 'apply-*' -o \
              -name 'diagnose-*' \
            \) -print | grep -q .; then
            echo 'Temporary release machinery must not enter the permanent branch.' >&2
            exit 1
          fi

      - name: Check patch whitespace
        run: git diff --check
