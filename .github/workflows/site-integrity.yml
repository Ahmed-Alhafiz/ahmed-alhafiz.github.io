name: Site integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile audit tools
        run: python -m py_compile tools/site_audit.py tools/editorial_quality_gate.py

      - name: Parse XML JSON feeds evidence manifests and every JSON-LD block
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path

          class JsonLdParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.active = False
                  self.buffer = []
                  self.blocks = []

              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)
                  if tag.lower() == "script" and attributes.get("type", "").lower() == "application/ld+json":
                      self.active = True
                      self.buffer = []

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.active:
                      self.blocks.append("".join(self.buffer))
                      self.active = False

              def handle_data(self, data):
                  if self.active:
                      self.buffer.append(data)

          xml_files = [
              Path("sitemap.xml"),
              Path("articles/feed.xml"),
              Path("en/articles/feed.xml"),
          ]
          json_files = [
              Path("articles/feed.json"),
              Path("en/articles/feed.json"),
              Path("articles/research-index.json"),
              Path("articles/ratq-fatq-big-bang/evidence/claims.json"),
          ]

          for path in xml_files:
              ET.parse(path)
          for path in json_files:
              json.loads(path.read_text(encoding="utf-8"))

          pages = blocks = 0
          for path in Path(".").rglob("*.html"):
              if ".git" in path.parts:
                  continue
              parser = JsonLdParser()
              parser.feed(path.read_text(encoding="utf-8"))
              for block in parser.blocks:
                  if block.strip():
                      json.loads(block)
                      blocks += 1
              pages += 1

          print(
              f"Parsed {pages} HTML files, {blocks} JSON-LD blocks, "
              f"{len(xml_files)} XML outputs and {len(json_files)} JSON outputs"
          )
          PY

      - name: Validate HTML links sitemap feeds hreflang and publication safety
        run: python tools/site_audit.py

      - name: Validate evidence depth transparency linking and medical safeguards
        run: python tools/editorial_quality_gate.py

      - name: Reject temporary release machinery
        shell: bash
        run: |
          set -euo pipefail
          if find .github -maxdepth 3 -type f \( \
              -name 'APPLY*' -o \
              -name 'part-*' -o \
              -name 'fix-*' -o \
              -name '*release*.trigger' -o \
              -name 'apply-global-editorial-rebuild-*' -o \
              -name 'diagnose-global-editorial-rebuild-*' \
            \) -print | grep -q .; then
            echo 'Temporary release machinery must not enter the permanent branch.' >&2
            exit 1
          fi

      - name: Check patch whitespace
        run: git diff --check
