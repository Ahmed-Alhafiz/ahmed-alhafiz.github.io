name: Release 05 verified quality gate

on:
  push:
    branches: [editorial-release-05]
    paths:
      - .github/release-05-quality-gate.trigger

permissions:
  contents: write

concurrency:
  group: release-05-quality-gate
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4
        with:
          ref: editorial-release-05
          fetch-depth: 0

      - name: Run structural and editorial verification
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/site_audit.py tools/editorial_quality_gate.py
          python tools/site_audit.py | tee /tmp/site-audit.txt
          python tools/editorial_quality_gate.py | tee /tmp/editorial-gate.txt
          python - <<'PY' | tee /tmp/data-parse.txt
          import json
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path

          class JsonLdParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.active = False
                  self.buf = []
                  self.blocks = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag.lower() == 'script' and attrs.get('type', '').lower() == 'application/ld+json':
                      self.active = True
                      self.buf = []
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.active:
                      self.blocks.append(''.join(self.buf))
                      self.active = False
              def handle_data(self, data):
                  if self.active:
                      self.buf.append(data)

          ET.parse('sitemap.xml')
          ET.parse('articles/feed.xml')
          pages = 0
          blocks = 0
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              parser = JsonLdParser()
              parser.feed(path.read_text(encoding='utf-8'))
              for block in parser.blocks:
                  if block.strip():
                      json.loads(block)
                      blocks += 1
              pages += 1
          print(f'PASS: parsed {pages} HTML pages, {blocks} JSON-LD blocks, sitemap.xml and articles/feed.xml')
          PY
          git diff --check

      - name: Record immutable release-candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Editorial Release 05 — Quality Gate Record'
            echo
            echo "- Verified commit before evidence record: \`$(git rev-parse HEAD)\`"
            echo "- Workflow run: \`${GITHUB_RUN_ID}\`"
            echo "- Verification time (UTC): \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`"
            echo '- Scope: two new reference studies, article hub, Atom feed, sitemap, reciprocal book links and permanent quality-gate expansion.'
            echo
            echo '## Structural site audit'
            echo '```text'
            cat /tmp/site-audit.txt
            echo '```'
            echo
            echo '## Editorial, evidence and safety gate'
            echo '```text'
            cat /tmp/editorial-gate.txt
            echo '```'
            echo
            echo '## JSON-LD and XML parse'
            echo '```text'
            cat /tmp/data-parse.txt
            echo '```'
            echo
            echo '## Claims deliberately not made'
            echo '- No claim of improved Google position before Search Console evidence.'
            echo '- No claim that an AI system has cited the studies before referral/citation evidence.'
            echo '- No publication, publisher, ISBN, sales or review claim for the forthcoming books.'
          } > .github/EDITORIAL_RELEASE_05_QA.md

          rm -f .github/release-05-quality-gate.trigger
          rm -f .github/workflows/release-05-quality-gate.yml
          git config user.name 'Ahmed-Alhafiz'
          git config user.email 'hhafz9924@gmail.com'
          git add -A
          git commit -m 'Record release 05 quality gate evidence'
          git push origin HEAD:editorial-release-05
