name: Finalize discovery release 06

on:
  push:
    branches: [main]
    paths:
      - .github/finalize-discovery-release-06.trigger

permissions:
  contents: write

concurrency:
  group: finalize-discovery-release-06
  cancel-in-progress: false

jobs:
  verify-record-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify merged discovery release
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'release=editorial-discovery-06' .github/finalize-discovery-release-06.trigger
          release_sha="$(git log --all --grep='Strengthen article discovery and citation integrity' -1 --format='%H')"
          test -n "$release_sha"
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"

      - name: Run complete repository, editorial and citation verification
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/site_audit.py \
            tools/editorial_quality_gate.py \
            tools/citation_integrity.py \
            tools/indexnow_urls.py
          python tools/site_audit.py | tee /tmp/site-audit.txt
          python tools/editorial_quality_gate.py | tee /tmp/editorial-gate.txt
          python tools/citation_integrity.py | tee /tmp/citation-gate.txt
          python - <<'PY' | tee /tmp/data-parse.txt
          import json
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path

          class JsonLdParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.active = False
                  self.buf = []
                  self.blocks = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag.lower() == 'script' and attrs.get('type', '').lower() == 'application/ld+json':
                      self.active = True
                      self.buf = []
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.active:
                      self.blocks.append(''.join(self.buf))
                      self.active = False
              def handle_data(self, data):
                  if self.active:
                      self.buf.append(data)

          sitemap = ET.parse('sitemap.xml')
          feed = ET.parse('articles/feed.xml')
          pages = 0
          blocks = 0
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              parser = JsonLdParser()
              parser.feed(path.read_text(encoding='utf-8'))
              for block in parser.blocks:
                  if block.strip():
                      json.loads(block)
                      blocks += 1
              pages += 1
          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9', 'a': 'http://www.w3.org/2005/Atom'}
          sitemap_urls = len(sitemap.findall('s:url', ns))
          feed_entries = len(feed.findall('a:entry', ns))
          print(f'PASS: parsed {pages} HTML pages and {blocks} JSON-LD blocks')
          print(f'PASS: sitemap contains {sitemap_urls} URLs; Atom feed contains {feed_entries} entries')
          PY
          test "$(cat 56a3e1b70f9c4d81a2e7b6c5f408d932.txt)" = '56a3e1b70f9c4d81a2e7b6c5f408d932'
          grep -Fq 'citation_integrity.py' .github/workflows/site-integrity.yml
          git diff --check

      - name: Verify public pages, bibliographic files and ownership key
        shell: bash
        run: |
          set -euo pipefail
          base='https://ahmed-alhafiz.github.io'
          : > /tmp/live-verification.txt
          check_public() {
            local path="$1"
            local needle="$2"
            local label="$3"
            local output="/tmp/live-$(echo "$path-$label" | tr '/ :?' '_____').txt"
            local ok=0
            for attempt in $(seq 1 36); do
              if curl --fail --silent --show-error --location --connect-timeout 20 --max-time 90 \
                "$base$path?release06=${GITHUB_RUN_ID}-${attempt}" -o "$output" \
                && grep -Fq "$needle" "$output"; then
                ok=1
                break
              fi
              sleep 15
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "FAIL: $label ($path)" | tee -a /tmp/live-verification.txt
              exit 1
            fi
            bytes="$(wc -c < "$output" | tr -d ' ')"
            echo "PASS: $label — $path — ${bytes} bytes" | tee -a /tmp/live-verification.txt
          }

          check_public '/' '/articles/teaching-names-ai-understanding/' 'homepage AI-study link'
          check_public '/' '/articles/spiritual-healing-exploitation-safeguarding/' 'homepage safeguarding link'
          check_public '/about/' '/articles/teaching-names-ai-understanding/' 'author-page AI-study link'
          check_public '/about/' '/articles/spiritual-healing-exploitation-safeguarding/' 'author-page safeguarding link'
          check_public '/articles/teaching-names-ai-understanding/' 'name="citation_public_url" content="https://ahmed-alhafiz.github.io/articles/teaching-names-ai-understanding/"' 'AI bibliographic metadata'
          check_public '/articles/teaching-names-ai-understanding/' 'href="citation.bib"' 'AI BibTeX link'
          check_public '/articles/teaching-names-ai-understanding/citation.bib' 'ليست بحثًا محكّمًا' 'AI BibTeX record'
          check_public '/articles/spiritual-healing-exploitation-safeguarding/' 'name="citation_public_url" content="https://ahmed-alhafiz.github.io/articles/spiritual-healing-exploitation-safeguarding/"' 'safeguarding bibliographic metadata'
          check_public '/articles/spiritual-healing-exploitation-safeguarding/' 'href="citation.bib"' 'safeguarding BibTeX link'
          check_public '/articles/spiritual-healing-exploitation-safeguarding/citation.bib' 'ليست بحثًا محكّمًا' 'safeguarding BibTeX record'
          check_public '/articles/ratq-fatq-big-bang/citation.bib' 'alhafiz2026ratq' 'existing-study BibTeX record'
          check_public '/methodology/' 'البيانات الببليوغرافية وقابلية الاستشهاد' 'methodology transparency note'
          check_public '/56a3e1b70f9c4d81a2e7b6c5f408d932.txt' '56a3e1b70f9c4d81a2e7b6c5f408d932' 'IndexNow ownership key'
          check_public '/robots.txt' 'User-agent: OAI-SearchBot' 'OAI search crawler access'

      - name: Submit verified changed URLs to IndexNow
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/indexnow.json <<'JSON'
          {
            "host":"ahmed-alhafiz.github.io",
            "key":"56a3e1b70f9c4d81a2e7b6c5f408d932",
            "keyLocation":"https://ahmed-alhafiz.github.io/56a3e1b70f9c4d81a2e7b6c5f408d932.txt",
            "urlList":[
              "https://ahmed-alhafiz.github.io/",
              "https://ahmed-alhafiz.github.io/about/",
              "https://ahmed-alhafiz.github.io/methodology/",
              "https://ahmed-alhafiz.github.io/articles/ratq-fatq-big-bang/",
              "https://ahmed-alhafiz.github.io/articles/six-days-creation-cosmic-time/",
              "https://ahmed-alhafiz.github.io/articles/teaching-names-ai-understanding/",
              "https://ahmed-alhafiz.github.io/articles/sleep-paralysis-jathoom/",
              "https://ahmed-alhafiz.github.io/articles/functional-seizures-vs-epilepsy/",
              "https://ahmed-alhafiz.github.io/articles/spiritual-healing-exploitation-safeguarding/"
            ]
          }
          JSON
          status=''
          for attempt in $(seq 1 8); do
            status="$(curl --silent --show-error --location --retry 2 --retry-all-errors \
              --connect-timeout 20 --max-time 90 \
              --output /tmp/indexnow-response.txt --write-out '%{http_code}' \
              --header 'Content-Type: application/json; charset=utf-8' \
              --data-binary @/tmp/indexnow.json \
              https://api.indexnow.org/indexnow || true)"
            if [[ "$status" == '200' || "$status" == '202' ]]; then
              break
            fi
            sleep 20
          done
          cat /tmp/indexnow-response.txt || true
          echo "HTTP $status" | tee /tmp/indexnow-status.txt
          if [[ "$status" != '200' && "$status" != '202' ]]; then
            echo "IndexNow did not accept the verified payload" >&2
            exit 1
          fi

      - name: Harden future IndexNow timing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/indexnow.yml')
          text = path.read_text(encoding='utf-8')
          marker = '      - name: Submit changed URLs\n'
          if 'Wait for the public ownership key' not in text:
              assert marker in text
              wait_step = '''      - name: Wait for the public ownership key
        shell: bash
        run: |
          set -euo pipefail
          key='56a3e1b70f9c4d81a2e7b6c5f408d932'
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location --connect-timeout 20 --max-time 60 \\
              "https://ahmed-alhafiz.github.io/${key}.txt?indexnow=${GITHUB_RUN_ID}-${attempt}" \\
              | grep -Fxq "$key"; then
              echo 'Public IndexNow ownership key is available.'
              exit 0
            fi
            sleep 15
          done
          echo 'Public IndexNow ownership key did not become available in time.' >&2
          exit 1
'''
              text = text.replace(marker, wait_step + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Record verified release and advance project memory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import os

          release_sha = os.environ['RELEASE_SHA']
          run_id = os.environ['GITHUB_RUN_ID']
          now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          site_audit = Path('/tmp/site-audit.txt').read_text(encoding='utf-8').strip()
          editorial = Path('/tmp/editorial-gate.txt').read_text(encoding='utf-8').strip()
          citation = Path('/tmp/citation-gate.txt').read_text(encoding='utf-8').strip()
          data_parse = Path('/tmp/data-parse.txt').read_text(encoding='utf-8').strip()
          live = Path('/tmp/live-verification.txt').read_text(encoding='utf-8').strip()
          indexnow = Path('/tmp/indexnow-status.txt').read_text(encoding='utf-8').strip()

          record = f'''# Discovery Release 06 — Live Verification

          **Status:** `EXECUTED_VERIFIED`  
          **Verified:** `{now}`  
          **Release commit:** `{release_sha}`  
          **Final verification workflow:** `{run_id}`

          ## Verified improvements

          - The two newest studies are linked from the homepage and author page in addition to the article hub and relevant book pages.
          - All six long-form reference studies expose consistent author, title, date, language and permanent-URL metadata through Article JSON-LD, Dublin Core and restrained `citation_*` fields.
          - Every long-form study has a visible per-study BibTeX record. Each record explicitly says that the website article is not peer reviewed.
          - A permanent citation-integrity gate checks visible references, JSON-LD citations, anchors, metadata and BibTeX consistency.
          - A public IndexNow ownership key and changed-URL workflow are installed. The verified release payload was accepted with `{indexnow}`.
          - The permanent IndexNow workflow now waits for the public key before future submissions, preventing a deployment race.

          ## Structural audit

          ```text
          {site_audit}
          ```

          ## Editorial gate

          ```text
          {editorial}
          ```

          ## Citation-integrity gate

          ```text
          {citation}
          ```

          ## JSON-LD/XML parse

          ```text
          {data_parse}
          ```

          ## Public deployment checks

          ```text
          {live}
          ```

          ## Limits

          - Technical discoverability and bibliographic clarity do not guarantee indexing, ranking or citation.
          - IndexNow is a notification protocol for participating engines, not a Google ranking signal.
          - No search or AI-performance claim is made until supported by real measurement.
          '''
          Path('.github/DISCOVERY_RELEASE_06_LIVE_VERIFICATION.md').write_text(record.replace('\n          ', '\n').strip() + '\n', encoding='utf-8')

          checkpoint_path = Path('.github/CONTENT_CURRENT_CHECKPOINT.md')
          checkpoint = checkpoint_path.read_text(encoding='utf-8').replace('**Updated:** 2026-09-01', '**Updated:** 2026-09-02')
          marker = '## Discovery release 06 — verified live deployment'
          block = f'''\n\n{marker}

          - Status: `EXECUTED_VERIFIED`.
          - Release commit: `{release_sha}`.
          - Homepage and `/about/` now link directly to the two newest studies.
          - Six long-form studies now expose matching Article, Dublin Core and restrained citation metadata plus one BibTeX file per study.
          - Permanent `tools/citation_integrity.py` is part of main-branch CI.
          - Permanent IndexNow notification is active with a live public key and deployment-race protection; release payload accepted with `{indexnow}`.
          - Structural, editorial, citation, XML/JSON-LD, browser and live public checks: PASS.
          - Evidence: `.github/DISCOVERY_RELEASE_06_LIVE_VERIFICATION.md`, `.github/DISCOVERY_RELEASE_06_QA.md`, `.github/DISCOVERY_RELEASE_06_VISUAL_QA.md`.
          - Next: preserve the verified pages long enough for measurement; do not publish additional pages merely to increase count. Continue research/backlog work internally and use 14/28/56-day evidence for public expansion decisions.
          '''.replace('\n          ', '\n')
          if marker not in checkpoint:
              checkpoint_path.write_text(checkpoint.rstrip() + block + '\n', encoding='utf-8')

          ledger_path = Path('.github/SEO_OPERATIONS_LEDGER.md')
          ledger = ledger_path.read_text(encoding='utf-8')
          marker = '### 2026-09-02 — Discovery and citation-integrity release 06 verified live'
          block = f'''\n\n{marker}
          - Task: owned-surface discoverability / citation usability / regression prevention.
          - Scope: homepage, author page, six long-form reference studies, methodology and search-engine change notification.
          - Action: linked newest studies from the strongest author surfaces; added truthful bibliographic metadata and per-study BibTeX; installed a permanent visible/machine citation-integrity audit; installed and hardened IndexNow changed-URL notification.
          - Release commit: `{release_sha}`.
          - Verification: structural, editorial, citation, JSON-LD/XML, browser and public-deployment checks passed; verified IndexNow payload accepted with `{indexnow}`.
          - Evidence: `.github/DISCOVERY_RELEASE_06_LIVE_VERIFICATION.md`.
          - Claims withheld: no ranking, indexing or AI-citation gain is claimed before measurement; website articles are not represented as peer reviewed.
          - Status: `EXECUTED_VERIFIED`.
          - Next: monitor 14/28/56-day data and avoid rewriting stable pages without a factual defect or evidence-backed opportunity.
          '''.replace('\n          ', '\n')
          if marker not in ledger:
              ledger_path.write_text(ledger.rstrip() + block + '\n', encoding='utf-8')

          truth_path = Path('.github/SEO_SOURCE_OF_TRUTH.md')
          truth = truth_path.read_text(encoding='utf-8').replace('Last verified: 2026-09-01 (Europe/Vienna)', 'Last verified: 2026-09-02 (Europe/Vienna)')
          marker = '## Verified discovery/citation baseline — 2026-09-02'
          block = f'''\n\n{marker}

          - Six long-form Arabic studies have matching canonical document identity across Article JSON-LD, Dublin Core, citation metadata and per-study BibTeX.
          - Newest studies are linked from the homepage, author page, article hub and relevant forthcoming-book page.
          - `tools/citation_integrity.py` runs in main-branch CI and verifies visible/machine references, anchors, metadata and BibTeX.
          - IndexNow ownership key is public and its changed-URL workflow is installed with deployment-race protection; release 06 payload was accepted with `{indexnow}`.
          - Evidence: `.github/DISCOVERY_RELEASE_06_LIVE_VERIFICATION.md`.
          - This baseline proves publication, parser clarity and protocol submission only; it does not prove ranking, indexing or AI citation.
          '''.replace('\n          ', '\n')
          if marker not in truth:
              truth_path.write_text(truth.rstrip() + block + '\n', encoding='utf-8')
          PY

          rm -f .github/finalize-discovery-release-06.trigger
          rm -f .github/workflows/finalize-discovery-release-06.yml
          git diff --check

      - name: Commit verified operational state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ahmed-Alhafiz'
          git config user.email 'hhafz9924@gmail.com'
          git add -A
          git commit -m 'Verify live discovery release 06'
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
