name: Apply book-page polish

on:
  push:
    branches:
      - global-editorial-rebuild-07
    paths:
      - .github/book-page-polish.trigger

permissions:
  contents: write

concurrency:
  group: book-page-polish
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply multilingual and mobile hierarchy corrections
        shell: bash
        run: |
          set -euo pipefail
          python .github/book_page_polish.py
          rm -f .github/book_page_polish.py
          rm -f .github/book-page-polish.trigger
          rm -f .github/workflows/book-page-polish.yml

      - name: Re-run complete structural and editorial gates
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/site_audit.py tools/editorial_quality_gate.py
          python tools/site_audit.py
          python tools/editorial_quality_gate.py
          git diff --check
          test ! -e .github/book_page_polish.py
          test ! -e .github/book-page-polish.trigger
          test ! -e .github/workflows/book-page-polish.yml

      - name: Commit verified corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ahmed-Alhafiz'
          git config user.email 'hhafz9924@gmail.com'
          git add -A
          git commit -m 'Polish multilingual book pages and mobile hierarchy'
          if ! git push origin HEAD:global-editorial-rebuild-07; then
            git pull --rebase origin global-editorial-rebuild-07
            git push origin HEAD:global-editorial-rebuild-07
          fi
