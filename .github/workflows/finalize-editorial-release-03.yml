name: Finalize editorial reference release 03

on:
  push:
    branches: [main]
    paths:
      - .github/finalize-editorial-release-03.manifest

permissions:
  contents: write

concurrency:
  group: finalize-editorial-reference-release
  cancel-in-progress: false

jobs:
  verify-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify installed release files and editorial gates
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'release=editorial-reference-03' .github/finalize-editorial-release-03.manifest
          for file in \
            articles/index.html \
            articles/ratq-fatq-big-bang/index.html \
            articles/six-days-creation-cosmic-time/index.html \
            articles/sleep-paralysis-jathoom/index.html \
            articles/functional-seizures-vs-epilepsy/index.html \
            guides/arabic-psychological-horror/index.html \
            methodology/index.html \
            tools/site_audit.py \
            tools/editorial_quality_gate.py \
            .github/EDITORIAL_REFERENCE_BENCHMARK.md \
            .github/CONTENT_CURRENT_CHECKPOINT.md; do
              test -s "$file"
          done
          python -m py_compile tools/site_audit.py tools/editorial_quality_gate.py
          python tools/site_audit.py
          python tools/editorial_quality_gate.py
          git diff --check

      - name: Verify public GitHub Pages release
        shell: bash
        run: |
          set -euo pipefail
          base='https://ahmed-alhafiz.github.io'
          check_page() {
            local path="$1"
            local needle="$2"
            local output="/tmp/page-$(echo "$path" | tr '/ ' '__').html"
            curl --fail --location --retry 8 --retry-all-errors --connect-timeout 20 --max-time 90 \
              "$base$path?verification=$(date +%s%N)" -o "$output"
            grep -Fq "$needle" "$output"
          }
          check_page '/articles/' 'الدراسات والمقالات'
          check_page '/articles/ratq-fatq-big-bang/' 'الرتق والفتق والانفجار العظيم'
          check_page '/articles/six-days-creation-cosmic-time/' 'أيام الخلق الستة'
          check_page '/articles/sleep-paralysis-jathoom/' 'شلل النوم'
          check_page '/articles/functional-seizures-vs-epilepsy/' 'النوبات الوظيفية'
          check_page '/guides/arabic-psychological-horror/' 'الرعب النفسي العربي'
          check_page '/methodology/' 'المنهج التحريري'
          check_page '/books/sirou-fi-alard/' '/articles/'
          check_page '/books/umm-abbas/' '/articles/'
          check_page '/about/' '/articles/'
          check_page '/sitemap.xml' '/articles/functional-seizures-vs-epilepsy/'
          check_page '/articles/feed.xml' 'functional-seizures-vs-epilepsy'

      - name: Record verified completion without duplicating history
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git log --all --grep='Publish second reference research release' -1 --format='%H')"
          test -n "$release_sha"
          export RELEASE_SHA="$release_sha"
          python - <<'PY'
          from datetime import date
          from pathlib import Path
          import os

          release_sha = os.environ['RELEASE_SHA']
          stamp = str(date.today())
          marker = '### 2026-09-01 — Live verification of reference research release 03'

          ledger_path = Path('.github/SEO_OPERATIONS_LEDGER.md')
          ledger = ledger_path.read_text(encoding='utf-8').rstrip()
          if marker not in ledger:
              ledger += f'''\n\n{marker}
          - Task: owned-surface research publishing / live deployment verification
          - Books: «قل سيروا في الأرض فانظروا كيف بدأ الخلق» + «أم عباس لجلب الحبيب ورد المطلقة»
          - Action: re-cloned the complete repository, parsed JSON-LD and XML, ran the full site audit and editorial quality gate, verified internal/reverse links, and fetched every new public GitHub Pages URL plus the sitemap and Atom feed.
          - Release commit: `{release_sha}`
          - Verified public surfaces: article hub; four reference studies; rebuilt psychological-horror guide; editorial methodology; author page; both linked forthcoming-book pages; sitemap; Atom feed.
          - Safety: the two medical studies retain educational-only wording, emergency guidance, diagnostic limits and explicit instructions not to stop treatment without the treating clinician.
          - Status: `EXECUTED_VERIFIED`
          - Measurement: no ranking or AI-citation claim is made at deployment. Review real Search Console and referral evidence at 14, 28 and 56 days.
          '''
              ledger_path.write_text(ledger.rstrip() + '\n', encoding='utf-8')

          checkpoint_path = Path('.github/CONTENT_CURRENT_CHECKPOINT.md')
          checkpoint = checkpoint_path.read_text(encoding='utf-8').rstrip()
          checkpoint_marker = '## Live deployment verification — 2026-09-01'
          if checkpoint_marker not in checkpoint:
              checkpoint += f'''\n\n{checkpoint_marker}

          - Release commit: `{release_sha}`.
          - Full repository audit: PASS.
          - Editorial reference quality gate: PASS.
          - JSON-LD and XML parsing: PASS.
          - Public GitHub Pages verification: PASS for the article hub, four reference studies, rebuilt guide, methodology, author page, both linked book pages, sitemap and Atom feed.
          - One-time installer files and partial bundles: removed.
          - Operational status: initial reference release is complete and verified; next editorial expansion is gated by evidence rather than volume.
          - Measurement windows: 14, 28 and 56 days from deployment. Do not claim search-rank or AI-citation improvement before real data exists.
          '''
              checkpoint_path.write_text(checkpoint.rstrip() + '\n', encoding='utf-8')
          PY

          rm -f .github/finalize-editorial-release-03.manifest
          rm -f .github/workflows/finalize-editorial-release-03.yml
          rm -f .github/test-bridge.txt .github/bridge-path-test.txt
          rm -f .github/editorial-release-03.part-* .github/editorial-release-03.manifest
          rm -f .github/workflows/apply-editorial-release-03.yml
          rm -f .github/workflows/apply-editorial-release-filebin.yml
          rm -f .github/workflows/apply-content-bundle.yml
          git diff --check

      - name: Commit verified operational state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ahmed-Alhafiz'
          git config user.email 'hhafz9924@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Verification was already recorded.'
            exit 0
          fi
          git commit -m 'Verify live reference research release'
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
