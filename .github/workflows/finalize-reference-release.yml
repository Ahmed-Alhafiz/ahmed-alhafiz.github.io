name: Finalize reference release ledger

on:
  push:
    branches:
      - main
    paths:
      - ".github/finalize-release.marker"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append verified release entry and re-audit
        run: |
          python tools/finalize_reference_release.py
          python tools/site_audit.py
          git diff --check
      - name: Commit final project memory
        run: |
          git config user.name "Ahmed-Alhafiz"
          git config user.email "hhafz9924@gmail.com"
          git add -A
          git commit -m "Record verified first reference-content release"
          git push
