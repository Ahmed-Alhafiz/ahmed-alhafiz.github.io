name: Apply Umm Abbas dossier 11

on:
  push:
    branches:
      - umm-abbas-fear-certainty-authority-11
    paths:
      - .github/umm-abbas-dossier-11.trigger

permissions:
  contents: write

concurrency:
  group: umm-abbas-dossier-11
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic image dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core libraqm0
          python -m pip install --disable-pip-version-check --quiet "pillow>=11,<12"
          python - <<'PY'
          from PIL import __version__, features
          print('Pillow', __version__, 'raqm', features.check('raqm'))
          if not features.check('raqm'):
              raise SystemExit('Pillow/libraqm Arabic shaping support is required')
          PY

      - name: Integrate the bilingual dossier and generate its share assets
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^run=[0-9]+$' .github/umm-abbas-dossier-11.trigger
          python .github/dossier11_integration_fix.py
          python .github/dossier11_marker_fix.py
          python .github/dossier11_integrate.py
          # Workflow YAML changes are committed directly after branch verification;
          # the GitHub Actions token is not used to mutate permanent workflows.
          git checkout -- .github/workflows
          python tools/generate_diagnostic_uncertainty_social_cards.py
          rm -f .github/dossier11_integration_fix.py
          rm -f .github/dossier11_marker_fix.py
          rm -f .github/dossier11_integrate.py
          rm -f .github/umm-abbas-dossier-11.trigger

      - name: Parse every public structured output
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/site_audit.py \
            tools/editorial_quality_gate.py \
            tools/discovery_integrity.py \
            tools/ux_integrity.py \
            tools/arabic_ui_integrity.py \
            tools/dossier11_integrity.py \
            tools/generate_diagnostic_uncertainty_social_cards.py
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path

          class JsonLdParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.active = False
                  self.buffer = []
                  self.blocks = []
              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)
                  if tag.lower() == 'script' and attributes.get('type', '').lower() == 'application/ld+json':
                      self.active = True
                      self.buffer = []
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.active:
                      self.blocks.append(''.join(self.buffer))
                      self.active = False
              def handle_data(self, data):
                  if self.active:
                      self.buffer.append(data)

          xml_files = [
              Path('sitemap.xml'),
              Path('articles/feed.xml'),
              Path('en/articles/feed.xml'),
              *sorted(Path('assets/figures').glob('*.svg')),
          ]
          json_files = [
              Path('articles/feed.json'),
              Path('en/articles/feed.json'),
              Path('articles/research-index.json'),
              *sorted(Path('articles').glob('*/evidence/claims.json')),
          ]
          for path in xml_files:
              ET.parse(path)
          for path in json_files:
              json.loads(path.read_text(encoding='utf-8'))

          pages = blocks = 0
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              parser = JsonLdParser()
              parser.feed(path.read_text(encoding='utf-8'))
              for block in parser.blocks:
                  if block.strip():
                      json.loads(block)
                      blocks += 1
              pages += 1
          print(
              f'Parsed {pages} HTML files, {blocks} JSON-LD blocks, '
              f'{len(xml_files)} XML/SVG outputs, and {len(json_files)} JSON outputs'
          )
          PY

      - name: Run structural editorial discovery UX Arabic and dossier gates
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/apply-umm-abbas-dossier-11.yml'
          parked='/tmp/apply-umm-abbas-dossier-11.yml'
          mv "$workflow" "$parked"
          trap 'mv "$parked" "$workflow" 2>/dev/null || true' EXIT

          python tools/site_audit.py
          python tools/editorial_quality_gate.py
          python tools/discovery_integrity.py
          python tools/ux_integrity.py
          python tools/arabic_ui_integrity.py
          python tools/dossier11_integrity.py
          git diff --check

          test ! -e .github/dossier11_integration_fix.py
          test ! -e .github/dossier11_marker_fix.py
          test ! -e .github/dossier11_integrate.py
          test ! -e .github/umm-abbas-dossier-11.trigger
          test -s assets/social/diagnostic-uncertainty-family-fear-ar.png
          test -s assets/social/diagnostic-uncertainty-family-fear-en.png

          mv "$parked" "$workflow"
          trap - EXIT

      - name: Commit verified dossier package to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ahmed-Alhafiz'
          git config user.email 'hhafz9924@gmail.com'
          git add -A
          git commit -m 'Integrate bilingual fear-before-diagnosis evidence dossier'
          if ! git push origin HEAD:umm-abbas-fear-certainty-authority-11; then
            git pull --rebase origin umm-abbas-fear-certainty-authority-11
            git push origin HEAD:umm-abbas-fear-certainty-authority-11
          fi
