name: Diagnose AI pillar 13 release archive

on:
  push:
    branches:
      - teaching-names-ai-pillar-13
    paths:
      - .github/ai13/DIAGNOSE

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Fingerprint complete recoverable members of truncated archive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find .github/ai13 -maxdepth 1 -type f -name 'part-*' | sort)
          test "${#parts[@]}" -eq 5
          cat "${parts[@]}" > /tmp/ai13-release.tgz.b64
          test "$(wc -c < /tmp/ai13-release.tgz.b64 | tr -d ' ')" -eq 80000
          echo 'a2a2637072b6b73fd9f7d6d093ab49ef0ebc93f0b50301c98cd266b212e04bf1  /tmp/ai13-release.tgz.b64' | sha256sum --check --strict
          base64 --decode /tmp/ai13-release.tgz.b64 > /tmp/ai13-release.tgz
          test "$(wc -c < /tmp/ai13-release.tgz | tr -d ' ')" -eq 60000
          echo 'a6b10e494079ceb446beb67b1f6ca49879141238ed8af0c2dce04c8d9c0618b7  /tmp/ai13-release.tgz' | sha256sum --check --strict

          set +e
          gzip -dc /tmp/ai13-release.tgz > /tmp/ai13-release.partial.tar
          inflate_rc=$?
          set -e
          test "$inflate_rc" -eq 1
          test "$(wc -c < /tmp/ai13-release.partial.tar | tr -d ' ')" -eq 244930
          echo 'd375ccac8daa5460d293b55bc8b07477d11bdb3d2e87d4b98b851b74252a4e64  /tmp/ai13-release.partial.tar' | sha256sum --check --strict

          mkdir /tmp/ai13-recovered
          set +e
          tar -xf /tmp/ai13-release.partial.tar -C /tmp/ai13-recovered
          extract_rc=$?
          set -e
          test "$extract_rc" -eq 2

          complete=(
            .github/ai13_integrate.py
            articles/teaching-names-ai-understanding/CITATION.cff
            articles/teaching-names-ai-understanding/citation.bib
            articles/teaching-names-ai-understanding/citation.ris
            articles/teaching-names-ai-understanding/evidence/claims.json
          )
          expected_sizes=(38645 1223 592 422 27520)
          for index in "${!complete[@]}"; do
            path="/tmp/ai13-recovered/${complete[$index]}"
            test -f "$path"
            test "$(wc -c < "$path" | tr -d ' ')" -eq "${expected_sizes[$index]}"
            sha256sum "$path"
          done

          python -m py_compile /tmp/ai13-recovered/.github/ai13_integrate.py
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/ai13-recovered')
          data = json.loads((root/'articles/teaching-names-ai-understanding/evidence/claims.json').read_text(encoding='utf-8'))
          assert data['dossier']['version'] == '2.1'
          assert len(data['claims']) == 12
          assert len(data['sources']) == 25
          for rel in [
              'articles/teaching-names-ai-understanding/CITATION.cff',
              'articles/teaching-names-ai-understanding/citation.bib',
              'articles/teaching-names-ai-understanding/citation.ris',
          ]:
              text = (root/rel).read_text(encoding='utf-8')
              assert '2.1' in text
          print('FIVE_COMPLETE_FILES_VERIFIED')
          PY