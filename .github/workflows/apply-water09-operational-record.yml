name: Apply water dossier operational record

on:
  push:
    branches:
      - water09-operational-record-10
    paths:
      - .github/water09-operational-record.trigger

permissions:
  contents: write

concurrency:
  group: water09-operational-record
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified release memory
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'run=1' .github/water09-operational-record.trigger
          python .github/water09_finalize_record.py
          rm -f .github/water09_finalize_record.py
          rm -f .github/water09-operational-record.trigger

      - name: Validate operational record against repository state
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '**Status:** `EXECUTED_VERIFIED`' .github/WATER_CIVILIZATION_POWER_09_PREMERGE.md
          grep -Fq 'Pull request: `#12`' .github/WATER_CIVILIZATION_POWER_09_PREMERGE.md
          grep -Fq 'b448ba512c38ba2dad7b1ddb857be9e7b97bac65' .github/WATER_CIVILIZATION_POWER_09_PREMERGE.md
          grep -Fq 'Verified Water, Civilization and Power release 09' .github/CONTENT_CURRENT_CHECKPOINT.md
          grep -Fq 'Current research inventory' .github/CONTENT_CURRENT_CHECKPOINT.md
          grep -Fq 'Water, Civilization and Power bilingual research dossier 09' .github/SEO_OPERATIONS_LEDGER.md
          test "$(grep -Fc '### 2026-09-02 — Water, Civilization and Power bilingual research dossier 09' .github/SEO_OPERATIONS_LEDGER.md)" -eq 1
          test ! -e .github/water09_finalize_record.py
          test ! -e .github/water09-operational-record.trigger
          git diff --check

      - name: Re-run persistent site and research gates
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/site_audit.py tools/editorial_quality_gate.py tools/discovery_integrity.py tools/generate_water_social_cards.py
          python tools/site_audit.py
          python tools/editorial_quality_gate.py
          python tools/discovery_integrity.py

      - name: Commit verified operational memory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ahmed-Alhafiz'
          git config user.email 'hhafz9924@gmail.com'
          git add \
            .github/WATER_CIVILIZATION_POWER_09_PREMERGE.md \
            .github/CONTENT_CURRENT_CHECKPOINT.md \
            .github/SEO_OPERATIONS_LEDGER.md \
            .github/water09_finalize_record.py \
            .github/water09-operational-record.trigger
          git commit -m 'Record verified water dossier release state'
          if ! git push origin HEAD:water09-operational-record-10; then
            git pull --rebase origin water09-operational-record-10
            git push origin HEAD:water09-operational-record-10
          fi
