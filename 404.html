<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>الصفحة غير موجودة | أحمد الحافظ</title>
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#090909">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="96x96">
  <style>
    :root{--bg:#080808;--text:#eee8df;--muted:#aaa39a;--gold:#b58a50;--gold2:#d0a865;--line:rgba(181,138,80,.3)}
    *{box-sizing:border-box}html,body{min-height:100%}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(700px 340px at 50% 15%,rgba(181,138,80,.07),transparent 62%),#080808;color:var(--text);font-family:"Noto Naskh Arabic","Amiri","Geeza Pro",Tahoma,Arial,sans-serif;text-align:center}
    main{width:min(640px,100%);padding:46px 30px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.012)}
    .code{font-family:Georgia,"Times New Roman",serif;font-size:clamp(62px,16vw,108px);line-height:1;color:var(--gold2);letter-spacing:.04em}
    h1{margin:18px 0 8px;font-size:30px;font-weight:600}p{margin:0 auto 28px;color:var(--muted);line-height:1.9;max-width:430px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 24px;border:1px solid var(--gold);border-radius:10px;color:var(--gold2);text-decoration:none}
    a:focus-visible{outline:2px solid var(--gold2);outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1>الصفحة غير موجودة</h1>
    <p>قد يكون الرابط قديمًا أو غير صحيح. يمكنك العودة إلى الموقع الرسمي للكاتب أحمد الحافظ.</p>
    <a href="/">العودة إلى الصفحة الرئيسية</a>
  </main>
</body>
</html>
