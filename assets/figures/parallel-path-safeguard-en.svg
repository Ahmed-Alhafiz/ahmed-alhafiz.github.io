<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">The Parallel-Path Safeguard</title>
<desc id="desc">A person-centred diagram connecting immediate safety, open hypotheses, assessment and follow-up, documentation, consent and boundaries, and voluntary family or spiritual support.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f2e9"/><stop offset="1" stop-color="#e7dfd1"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#15202b" flood-opacity=".16"/></filter>
  <style>
    .sans{font-family:"DejaVu Sans",Arial,sans-serif}.title{font-size:42px;font-weight:800;fill:#17202a}.subtitle{font-size:19px;fill:#5a6874}.label{font-size:20px;font-weight:800;fill:#17202a}.small{font-size:14px;fill:#5c6974}.center-title{font-size:28px;font-weight:800;fill:#fff}.center-small{font-size:16px;fill:#d4e0e7}.rule{stroke:#bd704e;stroke-width:4;stroke-linecap:round}.path{stroke:#356377;stroke-width:3;fill:none;stroke-dasharray:8 7}.number{font-size:17px;font-weight:800;fill:#fff}
  </style>
</defs>
<rect width="1200" height="760" rx="28" fill="url(#bg)"/>
<text x="80" y="70" class="sans title">The Parallel-Path Safeguard</text>
<text x="80" y="107" class="sans subtitle">Several routes can work together; the person—not the explanation—stays at the centre</text>
<line x1="80" y1="137" x2="1120" y2="137" class="rule"/>

<path d="M600 380C470 330 380 255 300 230" class="path"/>
<path d="M600 380C730 330 820 255 900 230" class="path"/>
<path d="M600 380C450 390 350 395 280 395" class="path"/>
<path d="M600 380C750 390 850 395 920 395" class="path"/>
<path d="M600 380C470 450 390 540 315 574" class="path"/>
<path d="M600 380C730 450 810 540 885 574" class="path"/>

<g filter="url(#shadow)"><circle cx="600" cy="380" r="126" fill="#0b1724"/><circle cx="600" cy="380" r="105" fill="none" stroke="#356377" stroke-width="2"/><text x="600" y="365" text-anchor="middle" class="sans center-title">Person first</text><text x="600" y="405" text-anchor="middle" class="sans center-small">voice · safety · choice</text><text x="600" y="438" text-anchor="middle" class="sans center-small">never reduced to one explanation</text></g>

<g filter="url(#shadow)">
  <rect x="80" y="173" width="360" height="112" rx="19" fill="#fffdf8" stroke="#d1c8b9"/>
  <circle cx="120" cy="207" r="22" fill="#bd704e"/><text x="120" y="213" text-anchor="middle" class="sans number">1</text>
  <text x="154" y="213" class="sans label">Immediate safety</text>
  <text x="120" y="253" class="sans small">risk · consciousness · injury · urgent care</text>

  <rect x="760" y="173" width="360" height="112" rx="19" fill="#fffdf8" stroke="#d1c8b9"/>
  <circle cx="800" cy="207" r="22" fill="#2b6076"/><text x="800" y="213" text-anchor="middle" class="sans number">2</text>
  <text x="834" y="213" class="sans label">Open hypotheses</text>
  <text x="800" y="253" class="sans small">sleep · neurological · psychiatric · medication</text>

  <rect x="60" y="338" width="360" height="112" rx="19" fill="#fffdf8" stroke="#d1c8b9"/>
  <circle cx="100" cy="372" r="22" fill="#2b6076"/><text x="100" y="378" text-anchor="middle" class="sans number">3</text>
  <text x="134" y="378" class="sans label">Assessment &amp; follow-up</text>
  <text x="100" y="418" class="sans small">clear appointment · second view · re-evaluation</text>

  <rect x="780" y="338" width="360" height="112" rx="19" fill="#fffdf8" stroke="#d1c8b9"/>
  <circle cx="820" cy="372" r="22" fill="#bd704e"/><text x="820" y="378" text-anchor="middle" class="sans number">4</text>
  <text x="854" y="378" class="sans label">Record without verdict</text>
  <text x="820" y="418" class="sans small">time · witnesses · experience · theory separate</text>

  <rect x="95" y="523" width="390" height="112" rx="19" fill="#fffdf8" stroke="#d1c8b9"/>
  <circle cx="135" cy="557" r="22" fill="#bd704e"/><text x="135" y="563" text-anchor="middle" class="sans number">5</text>
  <text x="169" y="563" class="sans label">Consent &amp; boundaries</text>
  <text x="135" y="603" class="sans small">no forced isolation · touching · silencing</text>

  <rect x="715" y="523" width="390" height="112" rx="19" fill="#fffdf8" stroke="#d1c8b9"/>
  <circle cx="755" cy="557" r="22" fill="#2b6076"/><text x="755" y="563" text-anchor="middle" class="sans number">6</text>
  <text x="789" y="553" class="sans label">Voluntary family &amp;</text><text x="789" y="581" class="sans label">spiritual support</text>
  <text x="755" y="614" class="sans small">accompanies care; never monopolises it</text>
</g>

<rect x="235" y="678" width="730" height="45" rx="22" fill="#23634b"/>
<text x="600" y="707" text-anchor="middle" class="sans center-small">A defined review point connects the paths and sets escalation thresholds</text>
</svg>
