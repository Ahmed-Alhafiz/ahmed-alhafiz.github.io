<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">سلسلة الخوف واليقين والسلطة</title>
<desc id="desc">مخطط من سبع مراحل يوضح كيف يمكن أن ينتقل عرض ملتبس إلى فراغ تفسيري وخوف عائلي ويقين مبكر ونقل للسلطة وتآكل للموافقة ثم تأخر أو ضرر، مع إمكان قطع السلسلة في كل مرحلة.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1724"/><stop offset="1" stop-color="#142c3c"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#071019" flood-opacity=".22"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d88b64"/></marker>
  <style>
    .ar{font-family:"Noto Sans Arabic","DejaVu Sans",Arial,sans-serif;direction:rtl;unicode-bidi:bidi-override}.title{font-size:43px;font-weight:800;fill:#fff}.subtitle{font-size:20px;fill:#c7d3db}.stage{font-size:22px;font-weight:800;fill:#17202a}.note{font-size:15px;fill:#52616d}.number{font-family:Arial,sans-serif;font-size:19px;font-weight:800;fill:#fff}.interrupt{font-size:17px;font-weight:700;fill:#e8f1f5}
  </style>
</defs>
<rect width="1200" height="760" rx="28" fill="url(#bg)"/>
<circle cx="95" cy="95" r="145" fill="none" stroke="#28546a" stroke-width="1" opacity=".7"/><circle cx="95" cy="95" r="220" fill="none" stroke="#28546a" stroke-width="1" opacity=".45"/>
<text x="1120" y="78" text-anchor="end" class="ar title">سلسلة الخوف–اليقين–السلطة</text>
<text x="1120" y="116" text-anchor="end" class="ar subtitle">إطار تحليلي: كيف يصبح الغموض نظام قرار قسريًا؟</text>
<line x1="80" y1="145" x2="1120" y2="145" stroke="#356377" stroke-width="2"/>

<!-- row 1 -->
<g filter="url(#shadow)">
  <rect x="815" y="185" width="305" height="126" rx="20" fill="#f5f1e8"/>
  <circle cx="1080" cy="222" r="24" fill="#bd704e"/><text x="1080" y="229" text-anchor="middle" class="number">1</text>
  <text x="1050" y="226" text-anchor="end" class="ar stage">إشارة ملتبسة</text>
  <text x="1084" y="268" text-anchor="end" class="ar note">واقعة حقيقية لا تسمّي سببها وحدها</text>

  <rect x="447" y="185" width="305" height="126" rx="20" fill="#f5f1e8"/>
  <circle cx="712" cy="222" r="24" fill="#2b6076"/><text x="712" y="229" text-anchor="middle" class="number">2</text>
  <text x="682" y="226" text-anchor="end" class="ar stage">فراغ تفسيري</text>
  <text x="716" y="268" text-anchor="end" class="ar note">مرحلة لا يعرف فيها أحد ما يكفي بعد</text>

  <rect x="80" y="185" width="305" height="126" rx="20" fill="#f5f1e8"/>
  <circle cx="345" cy="222" r="24" fill="#bd704e"/><text x="345" y="229" text-anchor="middle" class="number">3</text>
  <text x="315" y="226" text-anchor="end" class="ar stage">تضخّم الخوف العائلي</text>
  <text x="349" y="268" text-anchor="end" class="ar note">الحب والعار والتهديد يعيدون وزن الوقائع</text>
</g>
<path d="M805 248H765" stroke="#d88b64" stroke-width="4" marker-end="url(#arrow)"/><path d="M437 248H397" stroke="#d88b64" stroke-width="4" marker-end="url(#arrow)"/>

<!-- row 2 -->
<path d="M232 320V359" stroke="#d88b64" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
  <rect x="80" y="370" width="305" height="126" rx="20" fill="#f5f1e8"/>
  <circle cx="345" cy="407" r="24" fill="#2b6076"/><text x="345" y="414" text-anchor="middle" class="number">4</text>
  <text x="315" y="411" text-anchor="end" class="ar stage">إغلاق مبكر</text>
  <text x="349" y="453" text-anchor="end" class="ar note">جواب مريح يسبق الدليل ويقاوم التصحيح</text>

  <rect x="447" y="370" width="305" height="126" rx="20" fill="#f5f1e8"/>
  <circle cx="712" cy="407" r="24" fill="#bd704e"/><text x="712" y="414" text-anchor="middle" class="number">5</text>
  <text x="682" y="411" text-anchor="end" class="ar stage">نقل السلطة</text>
  <text x="716" y="453" text-anchor="end" class="ar note">ينتقل القرار إلى من يدّعي امتلاك السبب</text>

  <rect x="815" y="370" width="305" height="126" rx="20" fill="#f5f1e8"/>
  <circle cx="1080" cy="407" r="24" fill="#2b6076"/><text x="1080" y="414" text-anchor="middle" class="number">6</text>
  <text x="1050" y="411" text-anchor="end" class="ar stage">تآكل الموافقة</text>
  <text x="1084" y="453" text-anchor="end" class="ar note">تُعاد تسمية الرفض مرضًا أو مقاومةً</text>
</g>
<path d="M395 433H435" stroke="#d88b64" stroke-width="4" marker-end="url(#arrow)"/><path d="M763 433H803" stroke="#d88b64" stroke-width="4" marker-end="url(#arrow)"/>

<!-- outcome -->
<path d="M968 506V545" stroke="#d88b64" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="705" y="557" width="415" height="112" rx="21" fill="#6d3942"/><circle cx="1078" cy="593" r="24" fill="#f0ad85"/><text x="1078" y="600" text-anchor="middle" class="number" fill="#17202a">7</text><text x="1046" y="600" text-anchor="end" class="ar stage" fill="#fff">التأخر أو الضرر</text><text x="1082" y="639" text-anchor="end" class="ar note" fill="#f3dfe2">تعطّل التقييم، أو الإكراه، أو الاعتداء، أو فقد الثقة</text></g>

<!-- interruption bar -->
<g filter="url(#shadow)"><rect x="80" y="557" width="565" height="112" rx="21" fill="#23634b"/><text x="605" y="595" text-anchor="end" class="ar interrupt">يمكن قطع السلسلة في كل مرحلة</text><text x="605" y="631" text-anchor="end" class="ar note" fill="#d9ece3">تقييم خطر · فرضيات مفتوحة · توثيق · موافقة · متابعة</text></g>
<text x="80" y="716" class="subtitle" font-size="14">Ahmed Alhafiz · analytical synthesis · version 1.0</text>
</svg>
