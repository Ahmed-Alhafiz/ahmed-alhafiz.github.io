<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">مسار المصدر من الاكتشاف إلى الاستشهاد</title>
  <desc id="desc">مخطط يوضح أن السماح بالزحف لا يكفي؛ يجب أن تكون الصفحة قابلة للفهرسة وذات صلة بالسؤال وأن تدعم الادعاء مباشرة وأن تكون واضحة وقابلة للاستخراج والتحقق قبل أن تصبح مرشحة للاستشهاد.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0b1724"/><stop offset="1" stop-color="#17354a"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d3a07e"/></marker></defs>
  <rect width="1200" height="580" rx="28" fill="url(#bg)"/>
  <text x="1100" y="72" text-anchor="end" font-family="Tahoma,Arial,sans-serif" font-size="31" font-weight="700" fill="#fff">من الصفحة إلى الاستشهاد: سلسلة لا اختصار سحري لها</text>
  <text x="1100" y="109" text-anchor="end" font-family="Tahoma,Arial,sans-serif" font-size="17" fill="#b8c8d3">هذا نموذج تشغيلي علني، لا كشف لخوارزمية سرية</text>
  <g font-family="Tahoma,Arial,sans-serif">
    <g><rect x="60" y="175" width="190" height="170" rx="18" fill="#fffdf8"/><text x="225" y="216" text-anchor="end" font-size="20" font-weight="700" fill="#14202b">1. الاكتشاف</text><text x="225" y="253" text-anchor="end" font-size="14" fill="#62707b">زحف مسموح</text><text x="225" y="279" text-anchor="end" font-size="14" fill="#62707b">رابط ثابت</text><text x="225" y="305" text-anchor="end" font-size="14" fill="#62707b">فهرس وروابط داخلية</text></g>
    <g><rect x="285" y="175" width="190" height="170" rx="18" fill="#fffdf8"/><text x="450" y="216" text-anchor="end" font-size="20" font-weight="700" fill="#14202b">2. الاسترجاع</text><text x="450" y="253" text-anchor="end" font-size="14" fill="#62707b">صلة دقيقة بالسؤال</text><text x="450" y="279" text-anchor="end" font-size="14" fill="#62707b">مصطلحات واضحة</text><text x="450" y="305" text-anchor="end" font-size="14" fill="#62707b">سياق موضوعي متماسك</text></g>
    <g><rect x="510" y="175" width="190" height="170" rx="18" fill="#fffdf8"/><text x="675" y="216" text-anchor="end" font-size="20" font-weight="700" fill="#14202b">3. الدعم</text><text x="675" y="253" text-anchor="end" font-size="14" fill="#62707b">المصدر يسند العبارة</text><text x="675" y="279" text-anchor="end" font-size="14" fill="#62707b">لا مجرد ذكر الموضوع</text><text x="675" y="305" text-anchor="end" font-size="14" fill="#62707b">مع حدود وعدم يقين</text></g>
    <g><rect x="735" y="175" width="190" height="170" rx="18" fill="#fffdf8"/><text x="900" y="216" text-anchor="end" font-size="20" font-weight="700" fill="#14202b">4. الاستخراج</text><text x="900" y="253" text-anchor="end" font-size="14" fill="#62707b">تعريفات وأرقام</text><text x="900" y="279" text-anchor="end" font-size="14" fill="#62707b">مقارنات وجداول</text><text x="900" y="305" text-anchor="end" font-size="14" fill="#62707b">وحدات معنى مكتملة</text></g>
    <g><rect x="960" y="175" width="180" height="170" rx="18" fill="#d88a61"/><text x="1115" y="216" text-anchor="end" font-size="20" font-weight="700" fill="#111820">5. الاستشهاد</text><text x="1115" y="253" text-anchor="end" font-size="14" fill="#322017">اختيار محتمل</text><text x="1115" y="279" text-anchor="end" font-size="14" fill="#322017">وليس ضمانًا</text><text x="1115" y="305" text-anchor="end" font-size="14" fill="#322017">يختلف حسب السؤال والنظام</text></g>
  </g>
  <line x1="250" y1="260" x2="279" y2="260" stroke="#d3a07e" stroke-width="3" marker-end="url(#a)"/><line x1="475" y1="260" x2="504" y2="260" stroke="#d3a07e" stroke-width="3" marker-end="url(#a)"/><line x1="700" y1="260" x2="729" y2="260" stroke="#d3a07e" stroke-width="3" marker-end="url(#a)"/><line x1="925" y1="260" x2="954" y2="260" stroke="#d3a07e" stroke-width="3" marker-end="url(#a)"/>
  <rect x="135" y="410" width="930" height="91" rx="45" fill="none" stroke="#88a5b6" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="600" y="450" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" font-weight="700" fill="#fff">الثقة العابرة للسلسلة: مؤلف واضح · مصادر أولية · مراجعة · تاريخ · تصحيح · استقلال عن الدعاية</text>
  <text x="600" y="480" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="14" fill="#b8c8d3">الفشل في أي حلقة قد يمنع الصفحة من الوصول إلى الحلقة التالية</text>
  <text x="1100" y="548" text-anchor="end" font-family="Tahoma,Arial,sans-serif" font-size="13" fill="#88a0af">Ahmed Alhafiz · Research Desk · 2026</text>
</svg>
