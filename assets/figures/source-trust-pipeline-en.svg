<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">The path from a page to a possible citation</title><desc id="desc">A public operational model: discovery, retrieval, support, extraction, and possible citation. Every stage depends on relevance, provenance, evidence, and transparency.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0b1724"/><stop offset="1" stop-color="#17354a"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d3a07e"/></marker></defs>
<rect width="1200" height="580" rx="28" fill="url(#bg)"/><text x="70" y="72" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#fff">From a page to a possible citation: no magic shortcut</text><text x="70" y="109" font-family="Arial,sans-serif" font-size="17" fill="#b8c8d3">A public operating model, not disclosure of a proprietary ranking system</text>
<g font-family="Arial,sans-serif">
<g><rect x="60" y="175" width="190" height="170" rx="18" fill="#fffdf8"/><text x="84" y="216" font-size="20" font-weight="700" fill="#14202b">1. Discovery</text><text x="84" y="253" font-size="14" fill="#62707b">Crawlable HTML</text><text x="84" y="279" font-size="14" fill="#62707b">Stable URL</text><text x="84" y="305" font-size="14" fill="#62707b">Sitemap and links</text></g>
<g><rect x="285" y="175" width="190" height="170" rx="18" fill="#fffdf8"/><text x="309" y="216" font-size="20" font-weight="700" fill="#14202b">2. Retrieval</text><text x="309" y="253" font-size="14" fill="#62707b">Question fit</text><text x="309" y="279" font-size="14" fill="#62707b">Clear terminology</text><text x="309" y="305" font-size="14" fill="#62707b">Coherent context</text></g>
<g><rect x="510" y="175" width="190" height="170" rx="18" fill="#fffdf8"/><text x="534" y="216" font-size="20" font-weight="700" fill="#14202b">3. Support</text><text x="534" y="253" font-size="14" fill="#62707b">Source entails claim</text><text x="534" y="279" font-size="14" fill="#62707b">Independent evidence</text><text x="534" y="305" font-size="14" fill="#62707b">Limits disclosed</text></g>
<g><rect x="735" y="175" width="190" height="170" rx="18" fill="#fffdf8"/><text x="759" y="216" font-size="20" font-weight="700" fill="#14202b">4. Extraction</text><text x="759" y="253" font-size="14" fill="#62707b">Definitions and numbers</text><text x="759" y="279" font-size="14" fill="#62707b">Tables and comparisons</text><text x="759" y="305" font-size="14" fill="#62707b">Complete answer units</text></g>
<g><rect x="960" y="175" width="180" height="170" rx="18" fill="#d88a61"/><text x="984" y="216" font-size="20" font-weight="700" fill="#111820">5. Citation</text><text x="984" y="253" font-size="14" fill="#322017">Possible selection</text><text x="984" y="279" font-size="14" fill="#322017">Never guaranteed</text><text x="984" y="305" font-size="14" fill="#322017">Query and system vary</text></g>
</g>
<line x1="250" y1="260" x2="279" y2="260" stroke="#d3a07e" stroke-width="3" marker-end="url(#a)"/><line x1="475" y1="260" x2="504" y2="260" stroke="#d3a07e" stroke-width="3" marker-end="url(#a)"/><line x1="700" y1="260" x2="729" y2="260" stroke="#d3a07e" stroke-width="3" marker-end="url(#a)"/><line x1="925" y1="260" x2="954" y2="260" stroke="#d3a07e" stroke-width="3" marker-end="url(#a)"/>
<rect x="135" y="410" width="930" height="91" rx="45" fill="none" stroke="#88a5b6" stroke-width="2" stroke-dasharray="7 7"/><text x="600" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#fff">Cross-stage trust: clear author · primary sources · review · dates · corrections · promotion separated</text><text x="600" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#b8c8d3">Failure at any stage can prevent the page from reaching the next</text><text x="70" y="548" font-family="Arial,sans-serif" font-size="13" fill="#88a0af">Ahmed Alhafiz · methodology and verification centre · 2026</text></svg>