<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">مدائن صالح وثمود: ثلاثة مستويات لا يجوز خلطها</title>
  <desc id="desc">خريطة بصرية تفصل النص الديني عن تاريخ المكان وعن هوية الآثار الباقية.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071521"/>
      <stop offset="1" stop-color="#123049"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="180" fill="#c89955" opacity=".09"/>
  <circle cx="90" cy="710" r="220" fill="#5aa6b5" opacity=".08"/>

  <text x="600" y="152" direction="rtl" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="48" font-weight="700" fill="#fff">مدائن صالح وثمود</text>
  <text x="600" y="198" direction="rtl" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="27" fill="#c9d8e3">ثلاثة مستويات لا يجوز خلطها</text>

  <g filter="url(#shadow)">
    <rect x="75" y="255" width="320" height="290" rx="26" fill="#10283a" stroke="#6aa7b3" stroke-width="2"/>
    <rect x="440" y="255" width="320" height="290" rx="26" fill="#10283a" stroke="#d0a25c" stroke-width="2"/>
    <rect x="805" y="255" width="320" height="290" rx="26" fill="#10283a" stroke="#8dba82" stroke-width="2"/>
  </g>

  <circle cx="235" cy="315" r="31" fill="#153f54"/><text x="235" y="325" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#8fd0da">1</text>
  <text x="235" y="380" direction="rtl" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="29" font-weight="700" fill="#fff">النص الديني</text>
  <text x="235" y="430" direction="rtl" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="22" fill="#d8e3ea">يربط الحِجر بقوم ثمود</text>
  <text x="235" y="466" direction="rtl" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="22" fill="#d8e3ea">ويجعل المكان موضع اعتبار</text>

  <circle cx="600" cy="315" r="31" fill="#49391f"/><text x="600" y="325" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#f0c57e">2</text>
  <text x="600" y="380" direction="rtl" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="29" font-weight="700" fill="#fff">المكان التاريخي</text>
  <text x="600" y="430" direction="rtl" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="22" fill="#d8e3ea">سجل متعدد الطبقات</text>
  <text x="600" y="466" direction="rtl" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="22" fill="#d8e3ea">تعاقبت عليه جماعات وحضارات</text>

  <circle cx="965" cy="315" r="31" fill="#264029"/><text x="965" y="325" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#a9d89f">3</text>
  <text x="965" y="380" direction="rtl" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="29" font-weight="700" fill="#fff">الآثار الباقية</text>
  <text x="965" y="430" direction="rtl" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="22" fill="#d8e3ea">معظم الواجهات المشهورة</text>
  <text x="965" y="466" direction="rtl" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="22" fill="#d8e3ea">مدافن نبطية مؤرخة ومنقوشة</text>

  <path d="M395 400 H440 M760 400 H805" stroke="#8fa9b8" stroke-width="3" stroke-dasharray="8 8"/>

  <rect x="150" y="600" width="900" height="94" rx="22" fill="#f4ead8"/>
  <text x="600" y="642" direction="rtl" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="25" font-weight="700" fill="#183044">الخلاصة: ارتباط المكان بثمود لا يجعل كل منشأة قائمة داخله ثمودية</text>
  <text x="600" y="675" direction="rtl" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="18" fill="#50606c">المصادر الأثرية: اليونسكو · الهيئة الملكية للعُلا · مشروع OCIANA للنقوش</text>

  <text x="78" y="725" font-family="Arial, sans-serif" font-size="18" fill="#8fa9b8">ahmedalhafiz.com</text>
</svg>
