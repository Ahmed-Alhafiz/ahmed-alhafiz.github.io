<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">6×4 Protocol for Testing Understanding Claims</title>
<desc id="desc">An English matrix testing each of six layers of understanding through four challenges: paraphrase, counterexample, transfer, and causal intervention. The protocol is an unvalidated analytical tool, not a consciousness test.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f3ea"/><stop offset="1" stop-color="#e7dfd1"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17202a" flood-opacity=".14"/></filter>
  <style>
    .sans{font-family:"DejaVu Sans",Arial,sans-serif}.title{font-size:40px;font-weight:800;fill:#17202a}.sub{font-size:18px;fill:#56636d}.head{font-size:17px;font-weight:800;fill:#fff}.row{font-size:16px;font-weight:800;fill:#17202a}.cell{font-size:12.5px;fill:#34434e}.foot{font-size:15px;font-weight:700;fill:#fff}.num{font-size:15px;font-weight:800;fill:#fff}
  </style>
</defs>
<rect width="1200" height="760" rx="28" fill="url(#bg)"/>
<text x="80" y="69" class="sans title">6×4 Protocol for Testing Understanding Claims</text>
<text x="80" y="105" class="sans sub">Four attempts to break each layer before accepting a broad claim</text>
<line x1="80" y1="135" x2="1120" y2="135" stroke="#bd704e" stroke-width="4" stroke-linecap="round"/>

<g filter="url(#shadow)">
<rect x="80" y="168" width="235" height="68" rx="15" fill="#0b1724"/><text x="198" y="210" text-anchor="middle" class="sans head">Claimed layer</text>
<rect x="326" y="168" width="190" height="68" rx="15" fill="#2b6076"/><text x="421" y="199" text-anchor="middle" class="sans head">Paraphrase</text><text x="421" y="222" text-anchor="middle" class="sans cell" fill="#dce8ee">same meaning, new form</text>
<rect x="527" y="168" width="190" height="68" rx="15" fill="#bd704e"/><text x="622" y="199" text-anchor="middle" class="sans head">Counterexample</text><text x="622" y="222" text-anchor="middle" class="sans cell" fill="#fff1e8">case that breaks the shortcut</text>
<rect x="728" y="168" width="190" height="68" rx="15" fill="#2b6076"/><text x="823" y="199" text-anchor="middle" class="sans head">Transfer</text><text x="823" y="222" text-anchor="middle" class="sans cell" fill="#dce8ee">unfamiliar object or setting</text>
<rect x="929" y="168" width="190" height="68" rx="15" fill="#23634b"/><text x="1024" y="199" text-anchor="middle" class="sans head">Intervention</text><text x="1024" y="222" text-anchor="middle" class="sans cell" fill="#dcecdf">change the cause, test effect</text>
</g>

<g filter="url(#shadow)">
<rect x="80" y="252" width="1039" height="61" rx="13" fill="#fffdf8" stroke="#d4ccbe"/><circle cx="118" cy="282" r="19" fill="#bd704e"/><text x="118" y="287" text-anchor="middle" class="sans num">1</text><text x="150" y="288" class="sans row">Symbol discrimination</text><text x="421" y="286" text-anchor="middle" class="sans cell">alternate script or spelling</text><text x="622" y="286" text-anchor="middle" class="sans cell">deceptively similar sign</text><text x="823" y="286" text-anchor="middle" class="sans cell">new alphabet or code</text><text x="1024" y="286" text-anchor="middle" class="sans cell">move or swap the sign</text>

<rect x="80" y="323" width="1039" height="61" rx="13" fill="#fffdf8" stroke="#d4ccbe"/><circle cx="118" cy="353" r="19" fill="#2b6076"/><text x="118" y="358" text-anchor="middle" class="sans num">2</text><text x="150" y="359" class="sans row">Distributional association</text><text x="421" y="357" text-anchor="middle" class="sans cell">synonym or new construction</text><text x="622" y="357" text-anchor="middle" class="sans cell">context defeats frequency</text><text x="823" y="357" text-anchor="middle" class="sans cell">new discourse domain</text><text x="1024" y="357" text-anchor="middle" class="sans cell">change only the cue</text>

<rect x="80" y="394" width="1039" height="61" rx="13" fill="#fffdf8" stroke="#d4ccbe"/><circle cx="118" cy="424" r="19" fill="#bd704e"/><text x="118" y="429" text-anchor="middle" class="sans num">3</text><text x="150" y="430" class="sans row">Composition and transfer</text><text x="421" y="428" text-anchor="middle" class="sans cell">structurally equivalent form</text><text x="622" y="428" text-anchor="middle" class="sans cell">valid exception</text><text x="823" y="428" text-anchor="middle" class="sans cell">untrained problem family</text><text x="1024" y="428" text-anchor="middle" class="sans cell">reverse relation or order</text>

<rect x="80" y="465" width="1039" height="61" rx="13" fill="#fffdf8" stroke="#d4ccbe"/><circle cx="118" cy="495" r="19" fill="#2b6076"/><text x="118" y="500" text-anchor="middle" class="sans num">4</text><text x="150" y="501" class="sans row">Grounded reference</text><text x="421" y="499" text-anchor="middle" class="sans cell">new description of scene</text><text x="622" y="499" text-anchor="middle" class="sans cell">conflicting image or source</text><text x="823" y="499" text-anchor="middle" class="sans cell">new environment or sensor</text><text x="1024" y="499" text-anchor="middle" class="sans cell">change the referent</text>

<rect x="80" y="536" width="1039" height="61" rx="13" fill="#fffdf8" stroke="#d4ccbe"/><circle cx="118" cy="566" r="19" fill="#bd704e"/><text x="118" y="571" text-anchor="middle" class="sans num">5</text><text x="150" y="572" class="sans row">Cause and intervention</text><text x="421" y="570" text-anchor="middle" class="sans cell">alternative causal wording</text><text x="622" y="570" text-anchor="middle" class="sans cell">hidden common cause</text><text x="823" y="570" text-anchor="middle" class="sans cell">new system, same rules</text><text x="1024" y="570" text-anchor="middle" class="sans cell">do(X): alter cause, compare</text>

<rect x="80" y="607" width="1039" height="61" rx="13" fill="#fffdf8" stroke="#d4ccbe"/><circle cx="118" cy="637" r="19" fill="#2b6076"/><text x="118" y="642" text-anchor="middle" class="sans num">6</text><text x="150" y="632" class="sans row">Intention, experience,</text><text x="150" y="653" class="sans row">and responsibility</text><text x="421" y="641" text-anchor="middle" class="sans cell">self-report stability</text><text x="622" y="641" text-anchor="middle" class="sans cell">instructions oppose claim</text><text x="823" y="641" text-anchor="middle" class="sans cell">no linguistic reward cue</text><text x="1024" y="641" text-anchor="middle" class="sans cell">no decisive current test</text>
</g>

<rect x="160" y="693" width="880" height="43" rx="21" fill="#6d3942"/>
<text x="600" y="720" text-anchor="middle" class="sans foot">Unvalidated comparison tool — not a consciousness score or substitute for experiment</text>
</svg>
