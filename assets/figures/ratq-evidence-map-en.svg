<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">From text to inference: keep the layers apart</title><desc id="desc">A diagram separating text, exegesis, observation, model, and inference, with four observational pillars converging on hot Big Bang cosmology.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f4ed"/><stop offset="1" stop-color="#e8e1d5"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#687885"/></marker></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="75" y="70" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="31" font-weight="700" fill="#141a22" direction="ltr">From text to inference: keep the layers apart</text><text x="75" y="106" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="17" fill="#66717c" direction="ltr">The strength of a claim depends on the kind of evidence that supports it.</text><g><rect x="55" y="150" width="202" height="128" rx="18" fill="#0b1724"/>
<text x="78" y="190" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="18" font-weight="700" fill="#fff" direction="ltr">1 — Text</text>
<text x="78" y="224" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="14" fill="#e1e8ed" direction="ltr">Ratq, then fatq;</text>
<text x="78" y="250" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="14" fill="#e1e8ed" direction="ltr">the act is attributed to God</text></g>
<g><rect x="280" y="150" width="202" height="128" rx="18" fill="#214157"/>
<text x="303" y="190" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="18" font-weight="700" fill="#fff" direction="ltr">2 — Exegesis</text>
<text x="303" y="224" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="14" fill="#e1e8ed" direction="ltr">Separation after union;</text>
<text x="303" y="250" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="14" fill="#e1e8ed" direction="ltr">rain and vegetation; others</text></g>
<g><rect x="505" y="150" width="202" height="128" rx="18" fill="#2b6076"/>
<text x="528" y="190" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="18" font-weight="700" fill="#fff" direction="ltr">3 — Observation</text>
<text x="528" y="224" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="14" fill="#e1e8ed" direction="ltr">Light, spectra, maps,</text>
<text x="528" y="250" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="14" fill="#e1e8ed" direction="ltr">and measured abundances</text></g>
<g><rect x="730" y="150" width="202" height="128" rx="18" fill="#a65437"/>
<text x="753" y="190" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="18" font-weight="700" fill="#fff" direction="ltr">4 — Model</text>
<text x="753" y="224" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="14" fill="#e1e8ed" direction="ltr">A hot expanding universe;</text>
<text x="753" y="250" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="14" fill="#e1e8ed" direction="ltr">equations open to revision</text></g>
<g><rect x="955" y="150" width="202" height="128" rx="18" fill="#5b3941"/>
<text x="978" y="190" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="18" font-weight="700" fill="#fff" direction="ltr">5 — Inference</text>
<text x="978" y="224" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="14" fill="#e1e8ed" direction="ltr">Creation, meaning,</text>
<text x="978" y="250" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="14" fill="#e1e8ed" direction="ltr">and philosophical position</text></g>
<line x1="257" y1="214" x2="274" y2="214" stroke="#687885" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="482" y1="214" x2="499" y2="214" stroke="#687885" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="707" y1="214" x2="724" y2="214" stroke="#687885" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="932" y1="214" x2="949" y2="214" stroke="#687885" stroke-width="3" marker-end="url(#arrow)"/><text x="75" y="340" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="25" font-weight="700" fill="#141a22" direction="ltr">Independent observational pillars of hot Big Bang cosmology</text><g><rect x="55" y="382" width="250" height="126" rx="16" fill="#fffdf8" stroke="#cfc6b9"/>
<circle cx="92" cy="419" r="18" fill="#2b6076"/><text x="92" y="425" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#fff">A</text>
<text x="119" y="421" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="17" font-weight="700" fill="#14202b" direction="ltr">Expansion</text>
<text x="79" y="454" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="13.5" fill="#65717b" direction="ltr">Redshift and the relation</text>
<text x="79" y="478" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="13.5" fill="#65717b" direction="ltr">between distance and recession</text></g>
<g><rect x="335" y="382" width="250" height="126" rx="16" fill="#fffdf8" stroke="#cfc6b9"/>
<circle cx="372" cy="419" r="18" fill="#2b6076"/><text x="372" y="425" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#fff">B</text>
<text x="399" y="421" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="17" font-weight="700" fill="#14202b" direction="ltr">CMB</text>
<text x="359" y="454" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="13.5" fill="#65717b" direction="ltr">A thermal spectrum and</text>
<text x="359" y="478" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="13.5" fill="#65717b" direction="ltr">early-universe anisotropies</text></g>
<g><rect x="615" y="382" width="250" height="126" rx="16" fill="#fffdf8" stroke="#cfc6b9"/>
<circle cx="652" cy="419" r="18" fill="#2b6076"/><text x="652" y="425" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#fff">C</text>
<text x="679" y="421" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="17" font-weight="700" fill="#14202b" direction="ltr">Light elements</text>
<text x="639" y="454" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="13.5" fill="#65717b" direction="ltr">Hydrogen, helium, and traces</text>
<text x="639" y="478" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="13.5" fill="#65717b" direction="ltr">from primordial nucleosynthesis</text></g>
<g><rect x="895" y="382" width="250" height="126" rx="16" fill="#fffdf8" stroke="#cfc6b9"/>
<circle cx="932" cy="419" r="18" fill="#2b6076"/><text x="932" y="425" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#fff">D</text>
<text x="959" y="421" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="17" font-weight="700" fill="#14202b" direction="ltr">Large-scale structure</text>
<text x="919" y="454" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="13.5" fill="#65717b" direction="ltr">Acoustic peaks, galaxy patterns,</text>
<text x="919" y="478" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="13.5" fill="#65717b" direction="ltr">and structure growth</text></g>
<path d="M180 510 C180 565 520 570 520 605" fill="none" stroke="#607b89" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M460 510 C460 565 550 570 550 605" fill="none" stroke="#607b89" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M740 510 C740 565 650 570 650 605" fill="none" stroke="#607b89" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1020 510 C1020 565 680 570 680 605" fill="none" stroke="#607b89" stroke-width="3" marker-end="url(#arrow)"/><rect x="390" y="604" width="420" height="96" rx="48" fill="#0b1724"/><text x="600" y="644" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="21" font-weight="700" fill="#fff" direction="ltr">The hot expanding-universe model</text><text x="600" y="674" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="13.5" fill="#c8d5dd" direction="ltr">Observationally strong — not a definition of creation from nothing</text><text x="75" y="729" text-anchor="start" font-family="Tahoma,Arial,sans-serif" font-size="13" fill="#7b858d" direction="ltr">Editorial graphic: Ahmed Alhafiz · 2026 · © Ahmed Alhafiz</text></svg>