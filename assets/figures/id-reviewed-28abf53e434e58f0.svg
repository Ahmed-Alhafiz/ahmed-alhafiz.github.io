<text x="75" y="923" font-family="DejaVu Sans, Arial, sans-serif" fill="#23634b" font-size="27" font-weight="700" text-anchor="start">Rantai dapat diputus pada setiap tahap</text>
<text x="75" y="959" font-family="DejaVu Sans, Arial, sans-serif" fill="#425564" font-size="20" font-weight="400" text-anchor="start">Penilaian risiko · hipotesis terbuka · pencatatan · persetujuan · tindak lanjut</text>
<text x="1460" y="955" font-family="DejaVu Sans, Arial, sans-serif" fill="#55656c" font-size="16" font-weight="400" text-anchor="end">Ahmed Alhafiz</text>
