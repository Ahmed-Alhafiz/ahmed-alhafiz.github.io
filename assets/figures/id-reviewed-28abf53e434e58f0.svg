<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="1600" height="1000" fill="#f3f5f5"/>
<rect x="0" y="0" width="1600" height="150" fill="#0b1724"/>
<text x="80" y="66" font-family="DejaVu Sans, Arial, sans-serif" fill="#ffffff" font-size="45" font-weight="700" text-anchor="start">Rantai Ketakutan–Kepastian–Kekuasaan</text>
<text x="80" y="112" font-family="DejaVu Sans, Arial, sans-serif" fill="#d8e7ec" font-size="22" font-weight="400" text-anchor="start">Kerangka analitis: bagaimana ketidakjelasan menjadi sistem keputusan yang memaksa?</text>
<rect x="50" y="186" width="430" height="197" rx="24" fill="#fffdf8" stroke="#a9cbd3" stroke-width="2"/>
<circle cx="87" cy="223" r="24" fill="#bd704e"/>
<text x="87" y="231" font-family="DejaVu Sans, Arial, sans-serif" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">1</text>
<text x="122" y="232" font-family="DejaVu Sans, Arial, sans-serif" fill="#17202a" font-size="21" font-weight="700" text-anchor="start">Tanda ambigu</text>
<text x="76" y="280" font-family="DejaVu Sans, Arial, sans-serif" fill="#52616d" font-size="16" font-weight="400" text-anchor="start">Peristiwa nyata tidak dengan</text>
<text x="76" y="304" font-family="DejaVu Sans, Arial, sans-serif" fill="#52616d" font-size="16" font-weight="400" text-anchor="start">sendirinya menunjukkan penyebabnya.</text>
<rect x="585" y="186" width="430" height="197" rx="24" fill="#fffdf8" stroke="#a9cbd3" stroke-width="2"/>
<circle cx="622" cy="223" r="24" fill="#bd704e"/>
<text x="622" y="231" font-family="DejaVu Sans, Arial, sans-serif" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">2</text>
<text x="657" y="232" font-family="DejaVu Sans, Arial, sans-serif" fill="#17202a" font-size="21" font-weight="700" text-anchor="start">Kekosongan penjelasan</text>
<text x="611" y="280" font-family="DejaVu Sans, Arial, sans-serif" fill="#52616d" font-size="16" font-weight="400" text-anchor="start">Tahap ketika belum ada informasi</text>
<text x="611" y="304" font-family="DejaVu Sans, Arial, sans-serif" fill="#52616d" font-size="16" font-weight="400" text-anchor="start">yang cukup.</text>
<rect x="1120" y="186" width="430" height="197" rx="24" fill="#fffdf8" stroke="#a9cbd3" stroke-width="2"/>
<circle cx="1157" cy="223" r="24" fill="#bd704e"/>
<text x="1157" y="231" font-family="DejaVu Sans, Arial, sans-serif" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">3</text>
<text x="1192" y="232" font-family="DejaVu Sans, Arial, sans-serif" fill="#17202a" font-size="21" font-weight="700" text-anchor="start">Ketakutan keluarga</text>
<text x="1146" y="259" font-family="DejaVu Sans, Arial, sans-serif" fill="#17202a" font-size="21" font-weight="700" text-anchor="start">membesar</text>
<text x="1146" y="306" font-family="DejaVu Sans, Arial, sans-serif" fill="#52616d" font-size="16" font-weight="400" text-anchor="start">Kasih sayang, rasa malu, dan</text>
<text x="1146" y="330" font-family="DejaVu Sans, Arial, sans-serif" fill="#52616d" font-size="16" font-weight="400" text-anchor="start">ancaman mengubah bobot fakta.</text>
<rect x="50" y="423" width="430" height="197" rx="24" fill="#fffdf8" stroke="#a9cbd3" stroke-width="2"/>
<circle cx="87" cy="460" r="24" fill="#bd704e"/>
<text x="87" y="468" font-family="DejaVu Sans, Arial, sans-serif" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">4</text>
<text x="122" y="469" font-family="DejaVu Sans, Arial, sans-serif" fill="#17202a" font-size="21" font-weight="700" text-anchor="start">Kesimpulan terlalu</text>
<text x="76" y="496" font-family="DejaVu Sans, Arial, sans-serif" fill="#17202a" font-size="21" font-weight="700" text-anchor="start">dini</text>
<text x="76" y="543" font-family="DejaVu Sans, Arial, sans-serif" fill="#52616d" font-size="16" font-weight="400" text-anchor="start">Jawaban yang menenangkan mendahului</text>
<text x="76" y="567" font-family="DejaVu Sans, Arial, sans-serif" fill="#52616d" font-size="16" font-weight="400" text-anchor="start">bukti dan menolak koreksi.</text>
<rect x="585" y="423" width="430" height="197" rx="24" fill="#fffdf8" stroke="#a9cbd3" stroke-width="2"/>
<circle cx="622" cy="460" r="24" fill="#bd704e"/>
<text x="622" y="468" font-family="DejaVu Sans, Arial, sans-serif" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">5</text>
<text x="657" y="469" font-family="DejaVu Sans, Arial, sans-serif" fill="#17202a" font-size="21" font-weight="700" text-anchor="start">Pengalihan wewenang</text>
<text x="611" y="517" font-family="DejaVu Sans, Arial, sans-serif" fill="#52616d" font-size="16" font-weight="400" text-anchor="start">Keputusan berpindah kepada orang</text>
<text x="611" y="541" font-family="DejaVu Sans, Arial, sans-serif" fill="#52616d" font-size="16" font-weight="400" text-anchor="start">yang mengaku tahu penyebabnya.</text>
<rect x="1120" y="423" width="430" height="197" rx="24" fill="#fffdf8" stroke="#a9cbd3" stroke-width="2"/>
<circle cx="1157" cy="460" r="24" fill="#bd704e"/>
<text x="1157" y="468" font-family="DejaVu Sans, Arial, sans-serif" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">6</text>
<text x="1192" y="469" font-family="DejaVu Sans, Arial, sans-serif" fill="#17202a" font-size="21" font-weight="700" text-anchor="start">Persetujuan terkikis</text>
<text x="1146" y="517" font-family="DejaVu Sans, Arial, sans-serif" fill="#52616d" font-size="16" font-weight="400" text-anchor="start">Penolakan ditafsirkan sebagai</text>
<text x="1146" y="541" font-family="DejaVu Sans, Arial, sans-serif" fill="#52616d" font-size="16" font-weight="400" text-anchor="start">penyakit atau perlawanan.</text>
<rect x="585" y="676" width="430" height="197" rx="24" fill="#fffdf8" stroke="#a9cbd3" stroke-width="2"/>
<circle cx="622" cy="713" r="24" fill="#bd704e"/>
<text x="622" y="721" font-family="DejaVu Sans, Arial, sans-serif" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">7</text>
<text x="657" y="722" font-family="DejaVu Sans, Arial, sans-serif" fill="#17202a" font-size="21" font-weight="700" text-anchor="start">Keterlambatan atau</text>
<text x="611" y="749" font-family="DejaVu Sans, Arial, sans-serif" fill="#17202a" font-size="21" font-weight="700" text-anchor="start">kerugian</text>
<text x="611" y="796" font-family="DejaVu Sans, Arial, sans-serif" fill="#52616d" font-size="16" font-weight="400" text-anchor="start">Evaluasi tertunda, paksaan,</text>
<text x="611" y="820" font-family="DejaVu Sans, Arial, sans-serif" fill="#52616d" font-size="16" font-weight="400" text-anchor="start">kekerasan, atau hilangnya</text>
<text x="611" y="844" font-family="DejaVu Sans, Arial, sans-serif" fill="#52616d" font-size="16" font-weight="400" text-anchor="start">kepercayaan.</text>
