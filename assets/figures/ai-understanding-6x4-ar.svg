<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">بروتوكول 6×4 لفحص ادعاء الفهم</title>
<desc id="desc">مصفوفة عربية تختبر كل طبقة من طبقات الفهم الست بأربعة اختبارات: إعادة الصياغة، المثال المضاد، النقل إلى سياق جديد، والتدخل السببي. البروتوكول أداة تحليلية غير مصدقة وليس اختبار وعي.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f3ea"/><stop offset="1" stop-color="#e7dfd1"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17202a" flood-opacity=".14"/></filter>
  <style>
    .ar{font-family:"Noto Sans Arabic","DejaVu Sans",Arial,sans-serif;direction:rtl;unicode-bidi:bidi-override}.title{font-size:41px;font-weight:800;fill:#17202a}.sub{font-size:18px;fill:#56636d}.head{font-size:18px;font-weight:800;fill:#fff}.row{font-size:17px;font-weight:800;fill:#17202a}.cell{font-size:13px;fill:#34434e}.foot{font-size:16px;font-weight:700;fill:#fff}.num{font-family:Arial,sans-serif;font-size:15px;font-weight:800;fill:#fff}
  </style>
</defs>
<rect width="1200" height="760" rx="28" fill="url(#bg)"/>
<text x="1120" y="69" text-anchor="end" class="ar title">بروتوكول 6×4 لفحص ادعاء الفهم</text>
<text x="1120" y="105" text-anchor="end" class="ar sub">أربع محاولات لكسر كل طبقة قبل قبول الادعاء</text>
<line x1="80" y1="135" x2="1120" y2="135" stroke="#bd704e" stroke-width="4" stroke-linecap="round"/>

<!-- column headers -->
<g filter="url(#shadow)">
<rect x="80" y="168" width="235" height="68" rx="15" fill="#0b1724"/><text x="198" y="210" text-anchor="middle" class="ar head">الطبقة المدعاة</text>
<rect x="326" y="168" width="190" height="68" rx="15" fill="#2b6076"/><text x="421" y="199" text-anchor="middle" class="ar head">إعادة الصياغة</text><text x="421" y="222" text-anchor="middle" class="ar cell" fill="#dce8ee">ثبات المعنى مع تغير الشكل</text>
<rect x="527" y="168" width="190" height="68" rx="15" fill="#bd704e"/><text x="622" y="199" text-anchor="middle" class="ar head">المثال المضاد</text><text x="622" y="222" text-anchor="middle" class="ar cell" fill="#fff1e8">حالة تكسر القاعدة السهلة</text>
<rect x="728" y="168" width="190" height="68" rx="15" fill="#2b6076"/><text x="823" y="199" text-anchor="middle" class="ar head">النقل</text><text x="823" y="222" text-anchor="middle" class="ar cell" fill="#dce8ee">كائن أو سياق غير مألوف</text>
<rect x="929" y="168" width="190" height="68" rx="15" fill="#23634b"/><text x="1024" y="199" text-anchor="middle" class="ar head">التدخل</text><text x="1024" y="222" text-anchor="middle" class="ar cell" fill="#dcecdf">ماذا يحدث عند تغيير السبب؟</text>
</g>

<!-- rows -->
<g filter="url(#shadow)">
<rect x="80" y="252" width="1039" height="61" rx="13" fill="#fffdf8" stroke="#d4ccbe"/><circle cx="285" cy="282" r="19" fill="#bd704e"/><text x="285" y="287" text-anchor="middle" class="num">1</text><text x="255" y="288" text-anchor="end" class="ar row">تمييز الرمز</text><text x="421" y="286" text-anchor="middle" class="ar cell">خط أو هجاء بديل</text><text x="622" y="286" text-anchor="middle" class="ar cell">رمز مشابه مضلل</text><text x="823" y="286" text-anchor="middle" class="ar cell">أبجدية أو ترميز جديد</text><text x="1024" y="286" text-anchor="middle" class="ar cell">تبديل موضع العلامة</text>

<rect x="80" y="323" width="1039" height="61" rx="13" fill="#fffdf8" stroke="#d4ccbe"/><circle cx="285" cy="353" r="19" fill="#2b6076"/><text x="285" y="358" text-anchor="middle" class="num">2</text><text x="255" y="359" text-anchor="end" class="ar row">الارتباط التوزيعي</text><text x="421" y="357" text-anchor="middle" class="ar cell">مرادف أو تركيب بديل</text><text x="622" y="357" text-anchor="middle" class="ar cell">سياق يكسر الأكثر شيوعًا</text><text x="823" y="357" text-anchor="middle" class="ar cell">مجال لغوي جديد</text><text x="1024" y="357" text-anchor="middle" class="ar cell">تغيير القرينة وحدها</text>

<rect x="80" y="394" width="1039" height="61" rx="13" fill="#fffdf8" stroke="#d4ccbe"/><circle cx="285" cy="424" r="19" fill="#bd704e"/><text x="285" y="429" text-anchor="middle" class="num">3</text><text x="255" y="430" text-anchor="end" class="ar row">التركيب والنقل</text><text x="421" y="428" text-anchor="middle" class="ar cell">بنية مكافئة</text><text x="622" y="428" text-anchor="middle" class="ar cell">استثناء صحيح</text><text x="823" y="428" text-anchor="middle" class="ar cell">مسألة غير مدرّبة</text><text x="1024" y="428" text-anchor="middle" class="ar cell">عكس العلاقة أو ترتيبها</text>

<rect x="80" y="465" width="1039" height="61" rx="13" fill="#fffdf8" stroke="#d4ccbe"/><circle cx="285" cy="495" r="19" fill="#2b6076"/><text x="285" y="500" text-anchor="middle" class="num">4</text><text x="255" y="501" text-anchor="end" class="ar row">الإحالة المتجذرة</text><text x="421" y="499" text-anchor="middle" class="ar cell">وصف آخر للمشهد</text><text x="622" y="499" text-anchor="middle" class="ar cell">صورة أو مصدر متعارض</text><text x="823" y="499" text-anchor="middle" class="ar cell">بيئة أو حس جديد</text><text x="1024" y="499" text-anchor="middle" class="ar cell">تغيير الشيء المشار إليه</text>

<rect x="80" y="536" width="1039" height="61" rx="13" fill="#fffdf8" stroke="#d4ccbe"/><circle cx="285" cy="566" r="19" fill="#bd704e"/><text x="285" y="571" text-anchor="middle" class="num">5</text><text x="255" y="572" text-anchor="end" class="ar row">السبب والتدخل</text><text x="421" y="570" text-anchor="middle" class="ar cell">صياغة سببية بديلة</text><text x="622" y="570" text-anchor="middle" class="ar cell">سبب مشترك خفي</text><text x="823" y="570" text-anchor="middle" class="ar cell">نظام جديد بالقواعد نفسها</text><text x="1024" y="570" text-anchor="middle" class="ar cell">do(X): غيّر السبب وقارن</text>

<rect x="80" y="607" width="1039" height="61" rx="13" fill="#fffdf8" stroke="#d4ccbe"/><circle cx="285" cy="637" r="19" fill="#2b6076"/><text x="285" y="642" text-anchor="middle" class="num">6</text><text x="255" y="632" text-anchor="end" class="ar row">القصد والتجربة</text><text x="255" y="653" text-anchor="end" class="ar row">والمسؤولية</text><text x="421" y="641" text-anchor="middle" class="ar cell">ثبات التقرير الذاتي</text><text x="622" y="641" text-anchor="middle" class="ar cell">تعليمات تناقض الادعاء</text><text x="823" y="641" text-anchor="middle" class="ar cell">سياق بلا مكافأة لغوية</text><text x="1024" y="641" text-anchor="middle" class="ar cell">لا اختبار حاسم حاليًا</text>
</g>

<rect x="160" y="693" width="880" height="43" rx="21" fill="#6d3942"/>
<text x="600" y="720" text-anchor="middle" class="ar foot">أداة مقارنة غير مُصدّقة — لا تنتج «درجة وعي» ولا تستبدل التجربة العلمية</text>
</svg>
